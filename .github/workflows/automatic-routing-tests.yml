      - name: Run A1 subindustry precision rule-set registry tests
        run: npm run test:a1-subindustry-precision-ruleset-registry

      # AGENT1-SUBINDUSTRY-PRECISION-COVERAGE-1 · PHASE 2C — la Ola 1 entra al check
      # obligatorio. Nueve subindustrias nuevas en `confirm_only`, cobertura de
      # precisión 2/73 → 11/73. Lo que esta suite impide que se rompa en silencio:
      #
      #   * § 19 toda rama NEGATIVA de una `confirm_only` es económicamente INERTE:
      #     el pliegue sectorial es la identidad sobre los cuatro estados base, la
      #     condición de subindustria del contrato de objetivo NO queda satisfecha, y
      #     el candidato no deja de persistirse. El único cambio económico que una
      #     regla nueva puede producir es un CONFIRMED positivo;
