      - name: Run official contact phone schema tests
        run: npm run test:agent2a:official-contact-phone-schema

      # AGENT2A-PHONE-REVEAL-4O-H2 — privacidad del modelo OFICIAL de múltiples teléfonos.
      #
      # Qué fija esta suite, que es lo único que un diff futuro no puede recordar:
      #   * SUPRIMIBILIDAD DERIVADA: el par `(provider, acquisition_mode)` se traduce con el
      #     mapeo exhaustivo de la 112 y se pregunta a la allowlist de 4O-E4, así que NO hay
      #     una segunda autoridad sobre qué procedencia puede borrarse. La paridad se mide
      #     sobre los 25 pares representables y en AMBAS direcciones (SQL ⇔ TypeScript);
      #   * `manual`, `unknown` y `(apollo, search)` SOBREVIVEN a una supresión de Apollo Y a
      #     una de Lusha: una DSAR dirigida a un proveedor no tiene autoridad sobre evidencia
      #     humana, y atribuir procedencia sin atribuir sería una conjetura ejecutada;
      #   * ALCANCE DE PERSONA en el camino cableado: la clave de Apollo identifica a QUÉ
      #     PERSONA, no qué proveedor se borra. Cablearlo a `single_provider` habría dejado
      #     viva la procedencia de Lusha y el número canónico con ella;
      #   * el alcance OFICIAL es MÁS ANCHO que el del escalar — la allowlist de
      #     `contacts.phone_source` protege el escalar y NO autoriza la colección oficial, así
      #     que un contacto con un número manual no puede blindar filas de Apollo ya pagadas;
      #   * ORDEN: candidato → escalar heredado → oficial, que es lo que hace el hito
      #     estrictamente ADITIVO sobre E1–E4.1;
      #   * INERCIA: sin colección oficial la RPC devuelve `no_official_collection` y NO
      #     escribe nada, que es todo contacto de Producción hoy — sin esa guarda, reproyectar
      #     desde un conjunto vacío convertiría la privacidad en pérdida de datos;
      #   * un fallo oficial NO se reporta como éxito, y tiene código PROPIO.
      #
      # Mutantes detectados: se retira `manual`; se retira `unknown`; desaparece el
      # `NOT EXISTS` del último origen; se quita la guarda de colección vacía; se quita la
      # guarda de procedencia del escalar; se pierde la estabilidad del titular; la proyección
      # deja de filtrar fuentes vivas; desaparece el tier manual de la reelección; se pierden
      # los locks; se ensancha un GRANT de la 114; aparece un DELETE; se toca `mobile_phone`.
      #
      # Determinista y offline: sólo lee archivos del disco y ejecuta la server action contra
      # un driver simulado. Sin red, sin Supabase, sin proveedores, 0 créditos, y NO toca
      # Producción ni ejecuta ninguna DSAR real.
      #
      # ⚠️ La suite de PostgreSQL REAL queda FUERA de este check a propósito, igual que sus
      # hermanas (4O-E2/E3/E4, 4O-F-R2, 4O-H1): exige un binario que se descarga
      # (`npm install --no-save embedded-postgres@17.6.0-beta.15`) y que `npm ci` del check
      # obligatorio no necesita. Ahí se miden las garantías que sólo PostgreSQL puede
      # demostrar — la transacción, los locks, la supervivencia cruzada real, el tombstone del
      # último origen, la reelección determinista, la sincronización del escalar, la
      # concurrencia con dos conexiones y los privilegios de EXECUTE. Se corre con:
      #   npm run test:agent2a:official-contact-phone-privacy:postgres
      - name: Run official contact phone privacy tests
        run: npm run test:agent2a:official-contact-phone-privacy

      # AGENT1-APOLLO-SECTOR-EVIDENCE-BOOTSTRAP-1 — el bloqueo estructural que la
      # corrida live `f4c8a60f` (Salud, CO, 2026-08-12) hizo visible: 20 créditos,
      # 0 enrichments, 0 candidatos, y la causa NO era la calidad de las reglas.
      #
      #   `mixed_companies/search` devolvió las 20 organizaciones sin `industry`,
      #   sin `keywords`, sin descripciones y sin `employee_count` — la única
      #   fuente de esos campos es `organization_enrichment` —, y a la vez
      #   `SECTOR_SIGNAL_TERMS` no tenía política para el sector pedido, así que el
      #   veredicto era `sector_not_mapped` INCONDICIONAL y terminal ANTES del
      #   enrichment. La evidencia necesaria para juzgar el sector no se podía
      #   adquirir nunca: el pipeline no podía producir un candidato ni en teoría.
      #
      # Lo que este paso guarda, en las DOS direcciones:
      #
      #   * que los 20 resultados REALES del checkpoint de esa corrida vuelvan a
      #     bloquearse sin autorización (17 rechazos sectoriales, los mismos), y
      #     que con la corrida autorizada lleguen a competir por los <=5 slots;
      #   * que la autorización exija las CUATRO precondiciones observadas de la
      #     búsqueda emitida — búsqueda real, cobertura de consulta completa,
      #     versión de catálogo coherente, términos resueltos —, y que una
      #     precondición AUSENTE en la metadata no se lea como cumplida;
      #   * que la adquisición NO confirme nada: ni sector, ni subindustria, ni
      #     elegibilidad para el objetivo, y que pedir «Salud» no confirme ninguna
      #     subindustria de Salud;
      #   * que un candidato con clasificación DECLARADA no entre por esta puerta
      #     — a Citigroup se le rechaza porque Apollo dice «retail banking», y eso
      #     no cambia;
      #   * que las ramas negativas `confirm_only` sigan ABSTENIÉNDOSE y no sean lo
      #     que autoriza el gasto;
      #   * paridad de Retail: las rutas con política de sector deciden IGUAL con y
      #     sin autorización;
      #   * los topes: <=5 enrichments, selección determinística e invariante al
      #     orden de entrada.
      #
      # § 17 — y, atravesando el runner de producción REAL, que lo que ese crédito
      # COMPRA sobreviva al rechazo anterior al writer. La corrida existe para
      # calibrar Wave 1, y el candidato que la calibra muere pre-writer por
      # construcción: la reevaluación posterior corre sin autorización, vuelve a
      # `sector_not_mapped` y no llega a `prospect_candidates`. Se prueba que con
