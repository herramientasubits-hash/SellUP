      # bloqueaba la corrida SIGUIENTE con `concurrent_execution_active`.
      #
      # Las dos invariantes que sólo se pueden vigilar automáticamente:
      #   1. que el gasto real se guarde ENTERO. Un `LEAST(actual, reserved)` cabe en
      #      una línea, arregla el síntoma y subcuenta exactamente la parte que
      #      importa. El ratchet compara el delta del período contra 7 y contra 6;
      #   2. que `confirmed_with_overage` se lea como ÉXITO en el wrapper y en las
      #      tres rutas. Tratarlo como fallo reintroduciría el defecto desde el
      #      llamador, con la reserva ya cerrada.
      #
      # Determinista y offline: módulos puros, dobles inyectados y lectura de fuente.
      # Sin red, sin Supabase, sin Apollo, sin Lusha, sin Tavily, 0 créditos y 0
      # escrituras. ENABLE_LUSHA_PREVIEW sigue OFF: esta suite no activa el proveedor.
      # AGENT1-LUSHA-MACRO-V2-ROUTING-CUTOVER-1 § 21 — la elegibilidad Lusha son las
      # 12 Macro Industrias, y sólo ellas.
      #
      # Qué vigila, y por qué cada mitad importa:
      #
      #   · COMPLETITUD — las 12 macro aprobadas resuelven capacidad, plan, ramas y
      #     reserva desde el MISMO plan. El modo de fallo realista es 11/12: la clave
      #     canónica más larga mide 43 caracteres y el contrato anterior la validaba
      #     con `max(40)`, así que la macro más ancha del catálogo se habría caído en
      #     silencio después de que la UI ya la ofreciera.
      #   · CIERRE — Educación NO es la ruta decimotercera. Es el negativo peligroso
      #     porque Lusha SÍ la publica (main 6): el error no sería «no se encuentra»,
      #     sino «se encuentra y devuelve colegios».
      #   · CABLEADO — la ruta que el wizard ejecuta DE VERDAD usa la autoridad nueva.
      #     Un resolvedor correcto que nadie llama pasa toda prueba de unidad y no
      #     cambia nada en producción.
      #
      # Entra en el MISMO job que el resto de las guardas de routing: un contexto
      # requerido nuevo no protegería nada hasta que alguien lo marcara obligatorio.
      - name: Run A1 Lusha Macro-v2 routing cutover tests
        run: npm run test:lusha-macro-v2-routing-cutover

      # AGENT1-LUSHA-FIRST-LIVE-QA-P0-FIX-1 §§ 2, 4, 5, 7, 9, 10, 11 — los dos
      # defectos que sólo aparecieron cuando Lusha corrió DE VERDAD en Producción, y
      # que ninguna suite anterior podía ver porque las dos son invisibles mientras
      # el resultado «parece» correcto:
      #
      #   · EXACTITUD — con objetivo 5 se persistieron NUEVE. El tope de PETICIONES
      #     funcionaba y por eso nadie lo notó: lo que faltaba era el tope de
      #     ACEPTACIÓN dentro de una página ya pagada. El caso A reproduce la forma
      #     literal del lote (4 + 5 revisables) y exige 5 exactos; la mutación
      #     comprueba que sin el tope la aritmética vuelve a dar 9.
      #   · PRECISIÓN — cinco Manufacturing genéricos entraron en una revisión de
      #     salud con 100/100, porque el contraste comparaba en los dos sentidos y
      #     `Pharmaceuticals Manufacturing` CONTIENE a `Manufacturing`. El ratchet
      #     lee el cuerpo de `industryMatches` y prohíbe el `||` invertido; el caso D
      #     es el negativo peligroso —la macro cuyo main ES Manufacturing tiene que
      #     seguir admitiéndolo, o el arreglo vaciaría una macro entera—.
      #
      # Arrastra las suites que el arreglo TOCA (ejecutor multi-rama, preview,
      # pending-review, paridad de duplicados) y las dos del catálogo macro, porque
      # la decisión de evidencia se extrajo a un núcleo neutral compartido con Apollo:
      # una regresión ahí cambiaría los veredictos de las DOS rutas.
      #
      # Entra en el MISMO job que el resto de las guardas: un contexto requerido
      # nuevo no protegería nada hasta que alguien lo marcara obligatorio.
      - name: Run A1 Lusha target exactness + Macro-v2 precision tests
        run: npm run test:a1-lusha-target-precision

      # AGENT1-LUSHA-PROVIDER-USAGE-OBSERVABILITY-1 — la corrida Lusha deja UNA fila
      # canónica en `provider_usage_logs`, que es lo único que la primera corrida REAL
      # (19-08) NO dejó: facturó de forma veraz en la reserva, en el lote y en la
      # telemetría multi-rama, y fue invisible en el ledger que Apollo y Tavily sí
      # alimentan. Lo que esta suite hace obligatorio, y que ninguna anterior veía:
      #
      #   · UNA fila AGREGADA por corrida. Una por rama o una por página
      #     multiplicaría el mismo gasto por el número de páginas — la mutación M1
      #     comprueba que emitir una por rama vuelve a poner la suite en rojo.
      #   · el importe es el LIQUIDADO, no el reservado (M2), y un sobrepaso se
      #     publica SIN recorte: M121 sigue siendo la única autoridad de gasto.
      #   · `results_returned` son las filas CRUDAS que la petición pagó, no los
      #     candidatos persistidos (M3) — 30, nunca 5.
      #   · la idempotencia se apoya en `usage_key`, el ÚNICO índice único que
      #     Producción tiene para esto (`idempotency_key` está indexada pero NO es
      #     única), así que una reentrada no puede abrir una 2ª fila económica (M4).
      #   · un fallo de observabilidad NO puede replay-ear al proveedor ni volver a
      #     liquidar (M5): si se propagara, el `catch` de la acción liquidaría dos
      #     veces y devolvería un error por una corrida ya cobrada, invitando a un
      #     reintento que gastaría otra vez.
      #   · el registrador no puede reservar/confirmar/liberar créditos (M6) ni
      #     escribir `agent_runs` (M7): la frontera de este hito es UNA tabla.
      #
      # Arrastra las suites que el cambio TOCA —el ratchet estático de la acción
      # (invertido, no aflojado), pending-review, la correlación de corrida que se
      # reutiliza, el gate de presupuesto— y la de columnas de correlación de Apollo,
      # porque el motor de inserción se EXTRAJO a un módulo neutral compartido: una
      # regresión ahí cambiaría las filas de las DOS rutas.
      #
      # Entra en el MISMO job que el resto de las guardas: un contexto requerido
      # nuevo no protegería nada hasta que alguien lo marcara obligatorio.
      - name: Run A1 Lusha provider usage observability tests
        run: npm run test:a1-lusha-provider-usage-observability

      - name: Run A1 budget overage reconciliation tests
        run: npm run test:agent1:budget-overage-reconciliation

      # La mitad que NINGUNA suite de TypeScript puede cubrir: que la 121 APLIQUE y que
      # PostgreSQL se comporte como el hito afirma. Tres cosas concretas que sólo se
      # demuestran con una base real —el 23514 de un sobrepaso en una reserva viva
      # frente a su ausencia en una confirmada; que un solo UPDATE que mueve `status` y
      # `credits_consumed` juntos se valide contra la fila FINAL; y que la corrida
      # siguiente reciba `insufficient_budget` por la ARITMÉTICA del paso 10 de
      # `try_reserve_wizard_credits`, no por ninguna constraint—. Aplica la cadena REAL
      # (064 y 121) leyendo los archivos verbatim de `supabase/migrations`, e incluye
      # una base paralela con SÓLO la 064 que prueba que el defecto existía.
      #
      # `embedded-postgres` ya está instalado por el paso de Agente 2A de más arriba, con
      # la versión PINCHADA 17.6.0-beta.15 (la serie de Producción; el rango `@17` no
      # resuelve). `SELLUP_REQUIRE_POSTGRES_HARNESS` convierte el skip en FALLO: sin
      # ella, que el arnés no resolviera pondría este paso verde con una migración
      # inaplicable. Sin `continue-on-error` y sin `|| true`.
      - name: Run A1 budget overage tests against real PostgreSQL
        run: npm run test:agent1:budget-overage-reconciliation:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'

      # ── AGENT2A-SEARCH-MORE-PHONES-1 ────────────────────────────────────
      #
      # «Buscar más números»: la tercera operación de teléfono. No es «Revelar teléfono»
      # (que parte de un candidato SIN teléfono) ni «Ver más números» (que sólo abre lo ya
      # guardado, gratis). Ésta PAGA, así que sus reglas entran al check obligatorio.
      #
      # Las dos suites puras fijan lo que decide si esa compra puede ocurrir y lo que se
      # afirma al cerrarla:
      #   * el PLANIFICADOR — un proveedor que YA contestó no se vuelve a llamar (su
      #     respuesta completa está guardada desde 4O-C/4O-D, así que repetirlo cobraría
      #     por el mismo payload); sólo identidades NATIVAS que la fila ya lleva, sin
      #     búsqueda general de Lusha, sin nombre+empresa y sin cruce entre proveedores; y
      #     fail-closed en las tres ramas de privacidad;
      #   * el DESENLACE — `no_new_distinct_phone` nunca se colapsa en `no_phone_found`, un
      #     fallo del proveedor nunca se degrada a «no encontramos», y el costo se registra
      #     ENTERO incluso cuando la corrida no aportó nada nuevo.
      #
      # Deterministas y offline: módulos puros, sin red, sin Supabase, sin Apollo, sin
      # Lusha, 0 créditos y 0 escrituras.
      - name: Run A2A search-more-phones planner and outcome tests
        run: npm run test:agent2a:search-more-phones

      # La frontera de COPY entre la acción gratuita y la pagada, que viven a centímetros
      # en el mismo panel. Lee los DOS archivos: éste tiene que decir BUSCAR y nombrar el
      # costo antes del clic, y el de 4O-G tiene que seguir sin poder usar ningún verbo de
      # búsqueda. El riesgo que cubre no es un copy feo, es que el operador confunda cuál
      # de las dos gasta.
      - name: Run A2A search-more-phones copy boundary tests
        run: npm run test:agent2a:search-more-phones-copy

      # La mitad que NINGUNA suite de TypeScript puede cubrir: que la 122 APLIQUE y que
      # PostgreSQL se comporte como el hito afirma. Aplica la cadena REAL leyendo los
      # archivos verbatim de `supabase/migrations` —099, 107, 102, 103, 109, 110, 111, 112,
      # 113, 114, 115, 120 y 122— y descarta el stub de una sola columna de
      # `phone_reveal_waterfall_runs` que trae el bootstrap, porque la 122 ensancha CHECKs
      # de columnas REALES que sólo existen si la 102/103 se aplican de verdad.
      #
      # Lo que se ejercita después de aplicar es el comportamiento: que un número adicional
      # de rango inferior se AÑADA sin desplazar al principal; que uno de rango superior sí
      # pase a principal y AUN ASÍ no reescriba `phone_reveal_provider` ni el costo del
      # reveal de Apollo; que un duplicado gane procedencia SIN duplicar la fila; la
      # idempotencia; que la supresión por PERSONA bloquee desde las DOS identidades
      # nativas del candidato; que un tombstone por número no revive; y que la función siga
      # sin poder borrar una fila de teléfono.
      #
      # `embedded-postgres` ya está instalado por el paso de Agente 2A de más arriba, con la
      # versión PINCHADA 17.6.0-beta.15. `SELLUP_REQUIRE_POSTGRES_HARNESS` convierte el skip
      # en FALLO: sin ella, que el arnés no resolviera pondría este paso verde con una
      # migración inaplicable. Sin `continue-on-error` y sin `|| true`.
      - name: Run A2A search-more-phones tests against real PostgreSQL
        run: npm run test:agent2a:search-more-phones:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'

      # La mitad que GASTA. Esta suite es la única que puede observar el gasto: el planificador
      # decide si la compra es autorizable y el arnés de PostgreSQL decide qué queda escrito,
      # pero cuántas veces se llamó al proveedor —y qué pasa cuando un gate falla a mitad de la
      # secuencia— sólo se ve desde aquí.
      #
      # Lo que fija, en orden de lo que costaría perderlo:
      #   * reserva rechazada / privacidad bloqueada / plan no elegible ⇒ 0 llamadas;
      #   * DOS submits concurrentes ⇒ 1 corrida, 1 claim y 1 SOLA llamada pagada, probado con
      #     el pozo ABUNDANTE (con el pozo justo lo que bloquearía sería el saldo, no la
      #     idempotencia, y el defecto seguiría vivo en cuanto hubiera créditos);
      #   * supresión bajo el LOCK ⇒ se retiene el NÚMERO y el costo se registra ENTERO;
      #   * `no_new_distinct_phone` nunca se colapsa en `no_phone_found`, y un fallo del
      #     proveedor nunca se degrada a «no encontramos»;
      #   * un costo NO reportado se liquida con el TOPE, jamás con 0;
      #   * ningún patch de la corrida lleva una columna del reveal INICIAL, y el writer
      #     terminal de la 111/120 no se invoca por esta ruta.
      #
      # El planificador que decide la elegibilidad es el REAL, no un mock: el arnés le da
      # hechos y usa su veredicto, así que aflojar el planificador rompe también esta suite.
      #
      # Offline: sin red, sin Supabase, sin Lusha, 0 créditos.
      - name: Run A2A search-more-phones runtime tests
        run: npm run test:agent2a:search-more-phones-runtime

      # AGENT2A-SEARCH-MORE-PHONES-1H — el permiso de producto es un flag DEDICADO
      # (`ENABLE_SEARCH_MORE_PHONES`), y ya NO `ENABLE_LUSHA_PHONE_REVEAL_FALLBACK` (el kill
      # switch del fallback MANUAL de Lusha, que hasta 1G esta operación reutilizaba). Dos
      # suites, offline y deterministas:
      #   * el parser del flag nuevo + la matriz de independencia CASO A/B/C/D contra
      #     variables de entorno reales — el CASO C (search_more=true, lusha_fallback=false
      #     ⇒ activo) es la prueba crítica del hito;
      #   * la guarda ESTÁTICA que lee el código (sin comentarios) de las dos server actions
      #     y del runtime, y prueba en ambas direcciones que ninguno de los dos flags se
      #     coló en el consumidor del otro.
      - name: Run A2A search-more-phones dedicated flag tests
        run: npm run test:agent2a:search-more-phones-flag

      # La UI, renderizada de verdad (jsdom) y sobre el drawer COMPLETO — no un componente
      # aislado. Lo que hay que demostrar es que el CTA aparece, y SÓLO aparece, junto al CTA
      # GRATUITO con el que un operador podría confundirlo.
      #
      # La propiedad más caliente del hito: EL PRIMER CLIC NO GASTA. El CTA abre una
      # confirmación; sólo confirmar invoca la acción que paga, y se afirma con el contador de
      # esa acción. Además: la confirmación NOMBRA a Lusha y muestra el techo de 5 créditos; un
      # doble clic sincrónico produce UNA invocación; el teléfono existente sigue visible
      # mientras busca; «Ver más números» aparece SIN F5 cuando la colección crece; y el
      # refresco posterior no gasta.
      - name: Run A2A search-more-phones UI tests
        run: npm run test:agent2a:search-more-phones-ui

      # AGENT2A-SEARCH-MORE-PHONES-1K — la LECTURA de preflight, ejecutada de verdad.
      #
      # Producción encontró un CTA pagado que se ofrecía y cuyo primer clic devolvía «No
      # pudimos iniciar la búsqueda»: el preflight resolvía candidato, colección, procedencia,
      # corridas y privacidad, y NO el presupuesto, mientras el runtime sí lo resolvía antes de
      # reservar. Dos conjuntos de hechos decidiendo la misma compra.
      #
      # Esta suite corre `readSearchMorePreflight` con el planificador REAL y el core de
      # crédito REAL, y simula sólo la frontera de I/O —incluido `checkBudget`, para que el
      # `readPhoneRevealCreditPools` que se ejercita sea el MISMO que usa la reserva. Fija:
      #   * sin regla de crédito de Lusha (el estado REAL de Producción) ⇒ el plan NO es
      #     elegible, y lo dice como configuración y no como falta de saldo;
      #   * 4 disponibles ⇒ insuficiente; 5 exactos y más ⇒ elegible;
      #   * una resolución que LANZA ⇒ `balance_unavailable`, que bloquea sin afirmar por qué;
      #   * la EXPOSICIÓN YA RESERVADA resta igual que en la reserva atómica — una
      #     aproximación `límite - consumo` ofrecería saldo comprometido por otra autorización;
      #   * sólo se pregunta por el pozo de LUSHA, y con el actor que reservará;
      #   * y mirar todo eso hace 0 llamadas de red y 0 escrituras de cualquier tipo.
      #
      # Offline y determinista: sin red, sin Supabase, sin proveedores, 0 créditos.
      - name: Run A2A search-more-phones budget preflight parity tests
        run: npm run test:agent2a:search-more-phones-budget
      # AGENT1-COUNTRY-SOURCE-PREPAID-NOVELTY-GATE-1 — el filtrado económico deja de
      # ocurrir DESPUÉS de pagar.
      #
      # La corrida real del 2026-08-19 (lote `e90832f9`) pidió 6 peticiones, recibió 60
      # filas crudas y 40 únicas, y aceptó CERO: 24 eran candidatos históricos activos,
      # 10 duplicados exactos y 6 quedaban fuera de la macro. Todo eso ya se sabía en
      # SellUp antes de preguntar, y aun así costó 6 créditos y $0.529.
      #
      # Lo que esta suite defiende, dicho como defecto:
      #   * que la fuente gratuita del país devuelva una muestra GENÉRICA y la deje
      #     reducir el objetivo — una constructora cerrando un hueco de salud;
      #   * que alguien escriba una SEGUNDA taxonomía macro para la fuente: el índice
      #     CIIU se DERIVA del catálogo canónico y del mismo evaluador que juzga a
      #     Apollo y a Lusha, y una prueba comprueba código a código que es así;
      #   * que el sector grueso (6 cubetas) confirme pertenencia a una macro (12) —
      #     que es literalmente el defecto de #306, cinco «Manufacturing genérico» en
      #     una búsqueda de salud;
      #   * que se reserve o se estime ANTES del trabajo gratuito, en cualquiera de las
      #     dos rutas: el orden se comprueba estáticamente sobre las dos acciones;
      #   * que una empresa DESCUBIERTA pero no persistida cierre hueco — un fallo de
      #     escritura disfrazado de ahorro;
      #   * que una rama compre su segunda página después de que la primera haya
      #     rendido cero empresas nuevas y útiles (3 de las 6 peticiones de la QA);
      #   * que esa parada se vuelva GLOBAL y mate la cobertura: es de RAMA, y una
      #     prueba comprueba que su vocabulario ni siquiera puede expresar otra cosa;
      #   * que se publique un ahorro en créditos o en dólares sin contrafactual.
      #
      # Offline y determinista: sin red, sin Supabase, sin Socrata, sin proveedor.
      # 0 créditos.
      - name: Run A1 pre-paid novelty gate tests
        run: npm run test:a1-prepaid-novelty-gate
      # ADDENDUM PROVIDER-SEEN — la memoria de lo que un proveedor de pago YA nos
      # mostró, independiente de `prospect_candidates`.
      #
      # El defecto que esta suite defiende: hoy la única huella que queda de una
      # empresa devuelta por un proveedor vive DENTRO del candidato persistido
      # (`source_trace.providerCompanyId`, medido 66/66 en Lusha y 0/10 en Apollo).
      # Recordamos exactamente lo que no hacía falta recordar y olvidamos lo que sí
      # —rechazada por macro, duplicado exacto, candidato histórico activo, sobrante
      # de objetivo—, así que la corrida siguiente vuelve a pagarlo.
      #
      # Lo que se comprueba, dicho como defecto:
      #   * que la memoria se escriba DESPUÉS de filtrar y herede los criterios del
      #     filtro, volviendo a olvidar lo rechazado (guarda estática de orden);
      #   * que la validez de la respuesta se derive del TAMAÑO de la lista y un
      #     error HTTP quede registrado como «cero empresas» — el defecto de #303;
      #   * que una corrida sin petición, o un fallo previo a respuesta válida,
      #     fabriquen memoria;
      #   * que una empresa sin dominio deje de ser identificable por su id;
      #   * que este PR suponga algo del contrato de `filters.companies.exclude` que
      #     el soporte humano de Lusha todavía no ha confirmado por escrito: ids,
      #     semántica combinada ids+dominios, estabilidad de id, máximo de elementos,
      #     orden, o relleno de página;
      #   * que la lista de dominios cambie por el mero hecho de existir la memoria;
      #   * que la memoria toque la autoridad económica (M121) o la observabilidad de
      #     gasto (`provider_usage_logs`), o publique un ahorro sin contrafactual;
      #   * que se degraden el dedupe entre ramas (#302), el objetivo exacto (#306) o
      #     la parada por novedad cero (#310).
      #
      # Offline y determinista: sin red, sin Supabase, sin proveedor. 0 créditos.
      - name: Run A1 provider-seen memory tests
        run: npm run test:a1-provider-seen-memory
