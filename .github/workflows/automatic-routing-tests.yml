      #   * §§ 21 y 25 «Formación Corporativa» sigue sin mapeo y ninguna regla de la
      #     Ola 1 se promociona a `full`.
      #
      # 0 migraciones, 0 escrituras en Producción, 0 créditos. Determinista y
