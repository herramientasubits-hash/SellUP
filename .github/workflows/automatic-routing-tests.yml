      # flags.
      - name: Run A1 subindustry precision Wave 1 tests
        run: npm run test:a1-subindustry-precision-wave1

      # AGENT1-SECTOR-POST-ENRICHMENT-ADMISSION-1 — la admisión sectorial por
      # precisión de hija entra al check obligatorio.
      #
      # El bloqueo que cierra, descubierto justo después de #274: el bootstrap
      # autoriza a COMPRAR la clasificación que `mixed_companies/search` no devuelve,
      # el perfil comprado CONFIRMA la subindustria que el usuario pidió, y el
      # veredicto sectorial vuelve igualmente a `sector_not_mapped` —porque no hay
      # política legacy para el sector padre— y mata al candidato antes del writer.
      #
      # Lo que estas suites fijan, y por qué tienen que correr en cada PR:
      #
      #   * §§ 3-7 una hija PEDIDA y confirmada OPERATIVAMENTE admite; la industria
      #     PADRE sola nunca admite, y la implicación no se invierte;
      #   * § 14 una subindustria que el usuario NO pidió no puede admitir a nadie;
      #   * §§ 5-6 las ramas negativas de `confirm_only` siguen ABSTENIÉNDOSE: no
      #     admiten y tampoco añaden rechazo;
      #   * §§ 8, 10, 11 fail-closed ante catálogo incoherente, búsqueda sin
      #     subindustrias y subindustria sin regla de precisión;
      #   * §§ 9, 16 precedencia: la política legacy manda donde existe, y Retail y
      #     Educación conservan sus decisiones EXACTAS — deriva cero;
      #   * §§ 17, 21 la cadena entera por el runner real: admitir NO es persistir, y
      #     un gate posterior (ownership) sigue rechazando con SU motivo;
      #   * § 22 replay offline de la cohorte real de RUN 1 `f4c8a60f` con enrichment
      #     simulado, sin una sola llamada al proveedor.
      #
      # 0 migraciones, 0 escrituras en Producción, 0 créditos, 0 llamadas a Apollo,
      # Tavily, Lusha, HubSpot o Supabase.
      - name: Run A1 sector post-enrichment admission tests
        run: npm run test:a1-sector-post-enrichment-admission

      # AGENT1-APOLLO-BOOTSTRAP-PURCHASE-GATE-THREADING-1 — el gate que guarda la
      # COMPRA recibe la autorización que dejó competir al candidato.
      #
      # El defecto que fija, medido en producción (lote `74a49b01`, SHA `6808835f`,
      # que ya incluía #274 y #276): 20 candidatos bootstrap-eligible, 5
      # seleccionados y CERO enrichments ejecutados, porque el runner llamaba al
      # cascade sin `sectorEvidenceBootstrap` y el gate volvía a juzgar sin
      # autorización — `sector_not_mapped` ⇒ `eligibility_blocked`. 20 créditos de
      # búsqueda, 0 candidatos, y la evidencia que el hito compra siguió sin
      # comprarse.
      #
      # Por qué NINGUNA suite anterior lo vio, y por qué esta sí: todas las demás
      # mockean `enrichCascade` entero, y un cascade mockeado siempre devuelve
      # `enriched: true`, así que el gate que rechazaba nunca llegaba a ejecutarse
      # en una prueba. Esta suite atraviesa el cascade de PRODUCCIÓN y sólo simula
      # el transporte HTTP.
      #
      # Lo que fija, y por qué tiene que correr en cada PR:
      #
      #   * § 13 replay de la cohorte real: BEFORE 5 seleccionados / 0 ejecutados
      #     con `eligibility_blocked` + `sector_not_mapped`; AFTER 5 de 5 compran,
      #     con la MISMA selección — cero deriva de ranking;
      #   * § 4 la autorización es de CANDIDATO y está acotada por el cap: una
      #     corrida autorizada NO autoriza a los 20, y un elegible no seleccionado
      #     no llega ni al gate de compra;
      #   * § 3 fail-closed por las cuatro precondiciones de #274, a través del
      #     runner: una sola ronda con la pregunta equivocada ⇒ 0 compras;
      #   * § 6 una compra que NUNCA se intentó no degrada al candidato — la
      #     regresión que dejó a los 5 mejores de `74a49b01` en `needs_enrichment`;
      #   * § 9 la cadena entera hasta la admisión de #276, y el límite declarado
      #     de que la hija que el retest pidió no tiene regla de precisión;
      #   * §§ 8, 12 caps intactos (<= 2 búsquedas, <= 5 enrichments, <= 25
      #     créditos) y reconciliación terminal sin `unclassified_final`;
      #   * § 11 Retail y Educación conservan sus decisiones EXACTAS.
      #
      # 0 migraciones, 0 escrituras en Producción, 0 créditos, 0 llamadas a Apollo,
      # Tavily, Lusha, HubSpot o Supabase.
      - name: Run A1 bootstrap purchase gate threading tests
        run: npm run test:a1-apollo-bootstrap-purchase-gate-threading

      # AGENT2A-PHONE-WATERFALL-4F — el waterfall de teléfono entra al check
      # obligatorio. Hasta 4F ninguna de estas suites corría en CI: la regresión
      # que 4F corrige (una prueba que seguía exigiendo el modal que 4D eliminó)
      # sobrevivió justamente porque nada la ejecutaba en el PR. Las seis son
      # deterministas: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run phone reveal UI tests
        run: npm run test:agent2a:phone-reveal-ui

      - name: Run phone reveal waterfall tests
        run: npm run test:agent2a:phone-waterfall

      - name: Run phone reveal waterfall legacy tests
        run: npm run test:agent2a:phone-waterfall-legacy

      - name: Run phone direct reveal tests
        run: npm run test:agent2a:phone-direct-reveal

      - name: Run phone credit reservation tests
        run: npm run test:agent2a:phone-credit-reservation

      - name: Run phone drawer sync tests
        run: npm run test:agent2a:phone-drawer-sync

      # AGENT2A-PHONE-REVEAL-ASYNC-UI-REFRESH-1 — el ciclo de vida asíncrono del reveal
      # entra al check obligatorio. La QA de Producción del 18-08 mostró el hueco entero:
      # backend perfecto (revealed en ~20 s, 1 teléfono persistido) y una UI que no se
      # movía, porque el estado de espera Y el sondeo se derivaban los dos del mismo
      # `phone_reveal_status` LEÍDO — así que un refetch que fallara o llegara sin el
      # estado nuevo dejaba el CTA idle sin que nadie volviera a mirar. La suite fija el
      # contrato que lo cierra: espera visible en el mismo tick del envío, sin segundo
      # envío posible, revalidación automática aunque el primer refetch reviente, parada
      # en todo terminal, y 0 llamadas a proveedor / 0 créditos desde el sondeo.
      - name: Run phone async UI refresh tests
        run: npm run test:agent2a:phone-async-ui-refresh

      # AGENT2A-PHONE-REVEAL-4N — la contabilidad del presupuesto entra al check
      # obligatorio. Es donde vive el defecto que este hito cierra y ninguna suite lo
      # cubría: la reserva confirmada de Apollo (8 créditos, `assumed_cap`) no entraba en
      # ningún cálculo de presupuesto porque Apollo no reporta lo que cobra, y sumarla sin
      # excluir el usage log de Lusha habría contado el mismo gasto dos veces (10 → 15 sobre
      # un pozo de 10). La suite reproduce las dos corridas live con sus cifras exactas,
      # verifica que las reservas se lean en UN solo snapshot (para que `reserved →
      # confirmed` no devuelva disponibilidad ni por un instante), que el pozo se empareje
      # tal como quedó ALMACENADO, y que el camino Apollo escriba por fin sus campos
      # terminales. Determinista: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run phone budget accounting tests
        run: npm run test:agent2a:phone-budget-accounting

      # AGENT2A-P0-PHONE-SUPPRESSION-NOKEY-1-R2 — CRITICAL CI GAP. Estas cinco
      # suites (phone-reveal-action-3d3, phone-reveal-async15,
      # phone-reveal-start-contract-1, phone-reveal-apollo-person-id-cache-1a,
      # phone-reveal-privacy-gate-not-evaluable-p0) ejercen el mismo endurecimiento
      # fail-closed del P0 de supresión sin clave (START/WEBHOOK/RECOVERY/
      # puerta-Lusha ahora bloquean `not_evaluable` en vez de dejarlo pasar). Las
      # TRES últimas NO estaban cableadas a NINGÚN script de npm — invisibles a CI
      # por completo, no solo a este workflow (la última ni siquiera existía antes
      # del propio hito P0) — así que un PR podía romper la resolución de
      # identidad de la supresión (o revertir el fail-closed) sin que ningún check
      # lo viera. Determinista: sin flags, sin proveedores, sin créditos y sin DB
      # real.
      - name: Run phone reveal action + P0 suppression identity tests
        run: npm run test:agent2a:phone-reveal-action

      # AGENT2A-P0-PREAPPROVAL-PHONE-IDENTITY-2 — el fail-closed del P0 anterior es
      # correcto, pero la UI seguía ofreciendo «Revelar teléfono» HABILITADO a
      # candidatos cuya supresión no se puede evaluar: el operador hacía clic y
      # recibía un error rojo de privacidad por algo imposible antes del clic. Estas
      # suites fijan que el botón y el backend usen LA MISMA resolución de identidad
      # (paridad comprobada contra `resolvePhoneCachePersonId` sobre la matriz
      # completa de formas de id × origen × cuenta) y que el bloqueo sea visible sin
      # gastar un clic. Se acompañan de las suites del backend que definen esa misma
      # regla, para que un cambio en una sola de las dos capas rompa el check.
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run P0 pre-approval phone identity eligibility tests
        run: npm run test:agent2a:p0-preapproval-phone-identity

      # AGENT2A-P0-PREAPPROVAL-PHONE-IDENTITY-4 (Fase 1) — la privacidad del teléfono deja
      # de estar clavada a la CACHÉ de Apollo: pasa a `provider_suppressions`, con clave
      # (provider, provider_person_id) y SIN cuenta. Estas suites fijan lo que sólo se
      # rompe en silencio: que la identidad se resuelva con la MISMA precedencia en la
      # puerta y en el escritor, que un titular de LUSHA sea expresable, que un fallo de
      # lectura NO se lea como «no suprimido», y que la firma del helper no gane un
      # parámetro de cuenta —el momento en que «sin cuenta» volvería a significar «sin
      # privacidad»—. Determinista: sin flags, sin proveedores, sin créditos, sin DB real.
      - name: Run provider-native phone suppression tests
        run: npm run test:agent2a:provider-native-suppression

      # AGENT2A-P0-PREAPPROVAL-PHONE-IDENTITY-4-R1 — la última capa. La Fase 1 dejaba el
      # re-chequeo DENTRO de la transacción final resolviendo la clave con reglas de
      # Apollo, así que un candidato de origen Lusha sin `apollo_person_id` no era
      # comprobado en absoluto ahí: para Lusha la última palabra la tenía una lectura
      # previa a la llamada al proveedor y fuera del lock.
      #
      # Estos ratchets son ESTÁTICOS: afirman cosas sobre el TEXTO de la 120 —la firma del
      # helper, que no gane un parámetro de cuenta, que la identidad se resuelva con la
      # misma precedencia en los dos caminos— que son invariantes de DISEÑO, y que
      # PostgreSQL no puede comprobar porque una migración con la firma equivocada aplica
      # igual de bien.
      #
      # ⚠️ CORRECCIÓN DE R2: este paso incluye una heurística de comillas que ANTES se
      # describía aquí como detector de «un literal SQL sin cerrar». No lo es. Mide
      # PARIDAD, no sintaxis: con el defecto real de este hito reinyectado —un apóstrofo
      # sin escapar dentro de un `COMMENT ON TABLE`, que hacía fallar la 120 entera con
      # SQLSTATE 42601— esta suite pasa 20/20. La aplicabilidad de la migración la prueban
      # los dos pasos de PostgreSQL real que vienen justo después, y ésa es la razón por
      # la que ahora son obligatorios.
      - name: Run provider-native transactional re-check ratchets
        run: npm run test:agent2a:provider-native-transactional-recheck

      # ── AGENT2A-P0-PREAPPROVAL-PHONE-IDENTITY-4-R2 ─────────────────────────────────
      # UNA MIGRACIÓN QUE PostgreSQL NO PUEDE APLICAR TIENE QUE ROMPER ESTE CHECK.
      #
      # Hasta R2 no lo rompía. El repo tenía suites de PostgreSQL real desde 4O-C, pero
      # TODAS quedaban fuera del check obligatorio porque `embedded-postgres` no es
      # dependencia del repo, y la única barrera aquí dentro era la heurística de comillas
      # del paso anterior. Prueba independiente de que eso no bastaba: en el head previo
      # `6002a153` la 120 fallaba con SQLSTATE 42601 por un apóstrofo sin escapar en un
      # `COMMENT ON TABLE`, y la suite estática pasaba. Reinyectado ese defecto exacto:
      # estática 20/20 verde, PostgreSQL real 27 fallos con `syntax error at or near "s"`.
      #
      # `embedded-postgres` sigue instalándose APARTE, con `--no-save` y la versión
      # PINCHADA, en vez de entrar en `package.json`: como dependencia normal descargaría
      # un binario de PostgreSQL en cada `npm ci` de cualquier workflow, no sólo aquí.
      # ⚠️ El rango `@17` NO resuelve (toda la serie 17 se publica como prerelease);
      # 17.6.0-beta.15 es además la serie de Producción.
      - name: Install embedded PostgreSQL harness
        run: npm install --no-save embedded-postgres@17.6.0-beta.15

      # `SELLUP_REQUIRE_POSTGRES_HARNESS` es la mitad que faltaba. Estas suites se SALTAN
      # solas cuando el módulo no resuelve —lo correcto en local, donde nadie debería
      # necesitar un binario de PostgreSQL para correr tests de TypeScript—, y ese mismo
      # skip convertiría este paso en decorativo: bastaría con que el `npm install` de
      # arriba fallara para que el check se pusiera verde con una migración inaplicable.
      # Con la variable puesta, no resolver el arnés LANZA. Sin `continue-on-error`, sin
      # `|| true` y sin condición de salto: si PostgreSQL no aplica la 120, esto es rojo.
      - name: Run provider-native suppression tests against real PostgreSQL
        run: npm run test:agent2a:provider-native-suppression:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'

      # La carrera de Lusha, que es la garantía que R1 cerró: la supresión que commitea
      # MIENTRAS la RPC espera el lock tiene que bloquear la persistencia. Eso no se puede
      # afirmar leyendo SQL — hacen falta dos conexiones compitiendo de verdad. Ambas
      # suites aplican la cadena REAL (099, 107, 109, 110, 111, 112, 113, 114, 115, 120)
      # leyendo los archivos verbatim de `supabase/migrations`.
      - name: Run provider-native in-flight race tests against real PostgreSQL
        run: npm run test:agent2a:provider-native-race:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'

      # El módulo de presupuestos, cuyo resolver es ahora la fuente económica canónica.
      - name: Run budget module tests
        run: npm run test:budgets

      # AGENT2A-PHONE-REVEAL-4O-B — el modelo canónico de MÚLTIPLES teléfonos entra al
      # check obligatorio desde el primer día, antes de que nada lo consuma. La razón es
      # que sus garantías son justamente las que se rompen en silencio: que la clave de
      # deduplicación NUNCA contenga el número (de lo que depende que un tombstone no
      # conserve lo que dice haber borrado), que la clave de procedencia no lleve PII y no
      # dependa del reloj (o un webhook reprocesado duplicaría la fila), que un número
      # inválido o suprimido no pueda ser principal, y que los vocabularios del SQL y de
      # TypeScript no se separen — una divergencia que no falla al compilar sino al
      # insertar. Determinista: sin flags, sin proveedores, sin créditos y sin DB real
      # (la migración solo se lee de disco; no se aplica en ningún sitio).
      - name: Run candidate multiple-phone model tests
        run: npm run test:agent2a:candidate-phone-collection

      # AGENT2A-PHONE-REVEAL-4O-C — captura de TODOS los teléfonos Apollo.
      #
      # 4O-B creó el modelo y no lo cableó; este bloque es el que hace que los números
      # adicionales que Apollo YA entregaba —y que la operadora YA pagó— dejen de
      # perderse al escribir. Lo que la suite protege, y que no falla al compilar:
      #
      #   * que el escalar `contact_enrichment_candidates.phone` siga siendo EXACTAMENTE
      #     el mismo teléfono que antes del hito (una regresión aquí cambia el dato
      #     visible de un candidato sin que nadie lo pida);
      #   * que un registro repetido por Apollo en la raíz y bajo `person` no se
      #     contabilice dos veces, ni genere una segunda procedencia;
      #   * que el escalar y el principal de la colección NUNCA se contradigan;
      #   * que un fallo del writer no se cierre como éxito ni deje un teléfono visible
      #     sin su colección;
      #   * que un tombstone no resucite por ninguno de los dos caminos;
      #   * que ningún teléfono, display ni `dedupe_key` llegue a un usage-log;
      #   * que la captura NO sea alcanzable desde el search, la caché, Lusha ni la UI.
      #
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real (la
      # persistencia se ejerce contra un doble en memoria con las mismas reglas).
      - name: Run Apollo phone collection capture tests
        run: npm run test:agent2a:apollo-phone-collection-capture

      - name: Run Lusha phone collection capture tests
        run: npm run test:agent2a:lusha-phone-collection

      # AGENT2A-PHONE-REVEAL-4O-E1 — política TERMINAL de supresión.
      #
      # La auditoría 4O-E0 encontró que ninguna suite de supresión entraba en este
      # check, y el defecto que 4O-E1 corrige es exactamente del tipo que sobrevive a
      # esa ausencia: las transacciones 110/111 responden `suppressed` (todos los
      # números del evento son tombstones) y ese resultado se agrupaba con los FALLOS
      # de escritura, así que el candidato se quedaba en vuelo, el cron lo
      # reseleccionaba en cada pasada sobre una respuesta que nunca iba a poder
      # persistirse, la corrida seguía activa y su reserva seguía `reserved` pese a que
      # el proveedor ya había cobrado. Nada de eso rompe una compilación.
      #
      # Lo que la suite protege:
      #   * que una supresión confirmada terminalice (`error` + `blocked_suppressed`) y
      #     NUNCA como `no_phone_found`, que es el estado que vuelve a hacer elegible un
      #     reveal PAGADO del mismo número suprimido;
      #   * que esa escritura sea CONDICIONAL, comprobando los filtros reales que se
      #     envían al driver: sin ellos una carrera convertiría un `revealed` legítimo
      #     en un `error`;
      #   * que el cron deje de seleccionar lo terminalizado, probado de forma NO vacía
      #     con la query real (5 suprimidos + 1 candidato en vuelo que sí debe salir);
      #   * que el costo REAL ya incurrido se preserve: el de Apollo en el candidato, y
      #     el de Lusha en su propia columna de la corrida — donde antes se borraba a
      #     `null` + `unknown` y la liquidación de la reserva leía ese cero;
      #   * que `stale_event`, `candidate_not_eligible` y una comprobación no disponible
      #     NO terminalicen: no afirman ninguna supresión;
      #   * que las RPC 110/111, las migraciones, la UI, los contactos y HubSpot queden
      #     intactos, y que este paso siga existiendo en el workflow.
      #
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run phone suppression terminal policy tests
        run: npm run test:agent2a:phone-suppression-terminal

      # AGENT2A-PHONE-REVEAL-4O-E2 — propagación de la supresión / DSAR a la COLECCIÓN.
      #
      # La migración 109 añadió un QUINTO sitio donde vive el teléfono
      # (`contact_enrichment_candidate_phones`) y la DSAR nunca supo de él: borraba la
      # caché, el escalar del candidato y los contactos, y dejaba viva la fila
      # `is_primary` de la colección. Desde ahí las RPC 110/111 hacen exactamente lo
      # que se construyeron para hacer —leer la colección bajo el lock, elegir el
      # número vivo y escribirlo en el escalar—, así que el número borrado VUELVE. No
      # por un fallo del borrado ni del reveal, sino por la costura entre los dos.
      # Nada de eso rompe una compilación, y la tabla está vacía hoy, así que tampoco
      # lo delata ningún dato.
      #
      # Lo que la suite protege:
      #   * que el motivo se TRADUZCA entre los dos vocabularios de supresión, que no
      #     comparten ni un valor: un pass-through fallaría la CHECK de la 109 en el
      #     100% de las filas y solo en runtime — la misma forma del 23514 que en el
      #     hilo de Agente 1 perdió «Almacenes La 14»;
      #   * que el tombstone borre el número Y conserve la `dedupe_key`, que es el
      #     UNIQUE que impide reinsertarlo: un DELETE desbloquearía el número;
      #   * que la tabla de PROCEDENCIAS no se toque (no lleva teléfono y es la
      #     evidencia de que hubo observación), garantizado además por privilegio;
      #   * que un tombstone NUNCA quede como principal, que el escalar nunca sea un
      #     número tombstoneado, y que no quede en null habiendo superviviente;
      #   * que la reelección use el ranking CANÓNICO y no el orden de llegada del
      #     proveedor;
      #   * que el escritor viejo del candidato por PostgREST haya DESAPARECIDO: si
      #     siguiera ahí volvería a poner `phone = null` encima del superviviente que
      #     la transacción acaba de elegir;
      #   * que un fallo de la propagación NO se reporte como supresión exitosa;
      #   * que las RPC 110/111, las migraciones 109/110/111, la política terminal de
      #     E1, la allowlist de contacts, la pata manual de Lusha y la UI queden
      #     intactas, y que este paso siga existiendo en el workflow.
      #
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real (la
      # migración solo se lee de disco; la atomicidad se demuestra aparte, contra un
      # PostgreSQL 17 efímero, en `test:agent2a:phone-suppression-propagation-postgres`,
      # que queda FUERA del check por depender de un binario que se descarga).
      - name: Run phone suppression propagation tests
        run: npm run test:agent2a:phone-suppression-propagation

      # AGENT2A-PHONE-REVEAL-4O-E3 — carreras de privacidad y puertas del Lusha manual.
      #
      # E1 cerró qué pasa cuando la transacción declara `suppressed`; E2 hizo que la
      # DSAR llegara a la colección canónica. Quedaban tres huecos, y los tres son del
      # tipo que no rompe ninguna compilación ni deja ningún dato que los delate:
      #
      #   * LA CARRERA EN VUELO. La comprobación POR PERSONA vivía solo en TypeScript,
      #     leída ANTES de la llamada al proveedor y FUERA del lock. Entre esa lectura
      #     y el COMMIT de la persistencia caben la respuesta del proveedor y una DSAR
      #     entera. La re-comprobación por NÚMERO que ya hacían las RPC 110/111 no lo
      #     cubre: la DSAR tombstonea los números que la colección YA tenía, y un
      #     número que el proveedor devuelve por primera vez no tiene tombstone que
      #     emparejar — entra vivo, y la persona borrada vuelve a tener teléfono
      #     visible minutos después de su propia supresión.
      #   * EL CIERRE POR TOMBSTONE ERA INCONDICIONAL. El webhook y la recuperación
      #     escribían `error` + `blocked_suppressed` con un `UPDATE … WHERE id = ?`
      #     sobre una decisión leída mucho antes, así que podían pisar un `revealed`
      #     que otro actor había alcanzado legítimamente.
      #   * EL DISPARO MANUAL DE LUSHA NO TENÍA PUERTA. La re-comprobación de supresión
      #     y `do_not_contact` existía solo en el waterfall: la acción manual de
      #     administración llamaba a Lusha —y pagaba— sin consultar ninguna de las dos.
      #
      # Lo que la suite protege:
      #   * que la migración 113 sea EXACTAMENTE la 110 y la 111 con tres ediciones
      #     acotadas. Se DERIVA del SQL vigente y se compara byte a byte: una
      #     restatement de ~1.800 líneas escrita a mano es el riesgo real del hito;
      #   * que las migraciones 110, 111 y 112 no se editen retroactivamente;
      #   * que el SQL nuevo sea SECURITY INVOKER, con `search_path` fijado, sin SQL
      #     dinámico, sin DELETE y ejecutable solo por service_role;
      #   * que el bloqueo PREVIO a la llamada valga 0 llamadas y 0 créditos, y que la
      #     supresión POSTERIOR retenga el número conservando el cargo REAL — declarar
      #     gratis una llamada pagada sería el bug que E1 ya corrigió una vez;
      #   * que las dos rutas de Lusha compartan UNA sola puerta, con la misma
      #     precedencia, en vez de dos copias que puedan divergir;
      #   * que el disparo manual la tenga realmente INYECTADA: un gate que existe pero
      #     no se cablea no protege nada;
      #   * que el manual siga guardando UN solo teléfono (el multi-phone sigue
      #     diferido) y que E1 y E2 queden intactos.
      #
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real. La
      # carrera de verdad —dos transacciones compitiendo por el mismo lock— se
      # demuestra aparte contra un PostgreSQL 17 efímero, en
      # `test:agent2a:phone-privacy-race-postgres`, que queda FUERA del check por
      # depender de un binario que se descarga.
      - name: Run phone privacy race and gate tests
        run: npm run test:agent2a:phone-privacy-race-gates

      # AGENT2A-PHONE-REVEAL-4O-E4 — erasure provenance-safe de teléfonos OFICIALES.
      #
      # El defecto que cierra: la supresión limpiaba la caché, el escalar del candidato
      # y la colección canónica, pero al llegar a `contacts` exigía que `phone_source`
      # estuviera en una allowlist SÓLO de Apollo. Un teléfono revelado por Lusha
      # sobrevivía intacto en la fila visible —la que pinta la UI y la que se
      # sincroniza a HubSpot— y la DSAR se declaraba `ok` con el dato personal a la
      # vista.
      #
      # Esta suite prueba las dos propiedades y su tensión:
      #   * procedencia Lusha DEMOSTRADA de punta a punta (reveal → metadata del
      #     candidato → aprobación → `contacts.phone_source`) ⇒ el teléfono se borra,
      #     junto con las 7 columnas de su tupla: dejar `phone_revealed_at` o
      #     `phone_processing_basis` vivos sería metadata delatora sobre el titular;
      #   * procedencia AUSENTE o ajena (`manual`, `unknown`, `NULL`, `apollo_search`,
      #     `provider_payload`) ⇒ el teléfono SOBREVIVE, incluso cuando su valor
      #     coincide exactamente con uno de la colección del candidato: coincidencia
      #     de valor no demuestra quién lo escribió;
      #   * `mobile_phone` NO se borra en el camino Lusha. La columna no tiene
      #     procedencia —no existe `mobile_phone_source` y sus únicos escritores son
      #     los formularios manuales de contacto—, así que la erasure es
      #     declaradamente PARCIAL cuando ese campo está poblado, y la suite lo afirma
      #     en voz alta en vez de disimularlo ampliando el borrado;
      #   * el UPDATE sigue siendo CONDICIONAL por la procedencia EXACTA observada
      #     (`.eq`, ya no `.in`): con dos patches distintos según procedencia, un `.in`
      #     permitiría aplicar el de Apollo —que incluye `mobile_phone`— a una fila que
      #     pasó a ser Lusha entre la lectura y la escritura.
      #
      # Determinista: sin flags, sin proveedores, sin créditos, sin DSAR real y sin DB.
      # La carrera de verdad —dos transacciones compitiendo por la misma fila— se
      # demuestra aparte contra un PostgreSQL 17 efímero, en
      # `test:agent2a:contacts-phone-privacy-erasure-postgres`, que queda FUERA del
      # check por depender de un binario que se descarga.
      - name: Run official contact phone privacy erasure tests
        run: npm run test:agent2a:contacts-phone-privacy-erasure

