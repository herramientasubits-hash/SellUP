      # ninguna carrera: un contacto aprobado desde Apollo conserva
      # `phone_source = apollo_reveal` para siempre, `updateContact` nunca toca esa
      # columna, y basta con que alguien teclee un celular a mano para que la DSAR lo
      # borrase.
      #
      # Esta suite prueba:
      #   * las tres procedencias admitidas (apollo_reveal, apollo_cache, lusha_reveal)
      #     siguen borrando `phone` y sus 7 columnas — la erasure NO se degrada;
      #   * ninguna de ellas toca `mobile_phone`, ni siquiera cuando el valor coincide:
      #     NO PROVENANCE → NO DESTRUCTIVE ERASURE;
      #   * `manual`, `unknown` y `NULL` siguen sin producir patch alguno;
