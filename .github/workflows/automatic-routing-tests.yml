      - name: Run manual Lusha multi-phone tests
        run: npm run test:agent2a:manual-lusha-multi-phone

      # AGENT2A-PHONE-REVEAL-4O-F-R2 — el disparo MANUAL de Lusha converge sobre la
      # infraestructura `legacy_lusha_only`.
      #
      # QUÉ DEFECTO CIERRA. La auditoría 4O-F-M0 fijó
      # `MANUAL_LUSHA_BUDGET_GATE = UNSAFE`: la acción manual llamaba a Lusha
      # DIRECTAMENTE — sin gate presupuestal, sin reserva atómica y sin single-flight.
      # Tres invocaciones concurrentes sobre el mismo candidato pagaban TRES veces, y la
      # única mitigación era un `useRef` de la UI, que no cubre una invocación directa de
      # la server action. R2 no le da una reserva propia a ese camino: lo ELIMINA, y la
      # operación pasa a estar representada de forma duradera como una corrida de un solo
      # proveedor, que es lo que siempre fue.
      #
      # QUÉ SE PROTEGE AQUÍ:
      #   * presupuesto: 0 disponible y 4-frente-a-5 ⇒ 0 llamadas; exactamente 5 ⇒ 1
      #     corrida, 1 pata reservada, 1 llamada; regla ausente y lectura caída ⇒
      #     fail-closed, cada uno con su motivo propio y NUNCA como «no elegible»;
      #   * single-flight: 3 invocaciones concurrentes ⇒ 1 sola operación pagada, probado
      #     con presupuesto 5 Y con 100 — si sólo pasara con 5, lo que bloquearía sería el
      #     saldo y el defecto seguiría vivo en cuanto hubiera pozo;
      #   * candidatos distintos NO se bloquean entre sí: el cerrojo es por candidato;
      #   * ledger: el usage-log lleva el id de la corrida REAL, así que
      #     `computeEffectiveConsumption` deduplica contra la reserva confirmada y una
      #     llamada de 5 créditos consume 5, nunca 10;
      #   * privacidad: DNC y supresión ANTES de reservar ⇒ 0 corridas y 0 reservas; DNC
      #     EN VUELO ⇒ el costo real se conserva y el número NO se persiste (la
      #     transacción 111/113 revisa tombstones y supresión por persona bajo el lock,
      #     pero NO lee `do_not_contact`, así que la puerta posterior sigue siendo
      #     necesaria y está scoped a la invocación manual);
      #   * multi-teléfono por la MISMA transacción que el waterfall, con facturación por
      #     RESPUESTA y jamás multiplicada por `phones.length`;
      #   * FLAGS: con `ENABLE_PHONE_REVEAL_WATERFALL = false` —su estado en Producción—
      #     el disparo manual SIGUE funcionando. Ese flag gobierna la UX del waterfall
      #     Apollo→Lusha, no la existencia de la contabilidad. El kill switch del reveal
      #     manual sigue siendo `ENABLE_LUSHA_PHONE_REVEAL_FALLBACK`.
      #
      # Mutantes detectados: el motor manual vuelve a quedar gated tras el flag del
      # waterfall; el usage-log pierde el id de la corrida (⇒ doble conteo); desaparece la
      # puerta de privacidad posterior a la respuesta; el multi-teléfono vuelve a
      # first-phone-only.
      #
      # Determinista y offline: sin red (fetch stub), sin Supabase real, sin Lusha, 0
      # créditos. La atomicidad de `reserve_and_create_phone_reveal_run` vive en la
      # migración 104, que R2 no modifica y que AGENT2A-PHONE-WATERFALL-4G ya validó
      # contra PostgreSQL real.
      #
      # Lo que ESE arnés no puede demostrar es la INTEGRACIÓN nueva: que el llamador
      # manual, al converger, obtenga de esa transacción una corrida `legacy_lusha_only`
      # con una sola pata; que tres invocaciones sobre CONEXIONES distintas produzcan una
      # sola llamada pagada; y que las filas reales del ledger, pasadas por la lógica real
      # de consumo efectivo, den 5 y no 10. Eso vive en
      # `test:agent2a:manual-lusha-legacy-convergence-postgres` (§ 48), que queda FUERA
      # del check por la misma razón que las demás suites de PostgreSQL: depende de un
      # binario que se descarga (`npm install --no-save embedded-postgres@17.6.0-beta.15`).
      - name: Run manual Lusha legacy-run convergence tests
        run: npm run test:agent2a:manual-lusha-legacy-convergence

      # AGENT2A-PHONE-REVEAL-4O-G — «Ver más números»: los teléfonos YA almacenados
      # se pueden LEER, y leerlos cuesta cero.
      #
      # QUÉ HUECO CIERRA. Desde 4O-C/4O-D la colección canónica de la migración 109
      # sí guarda todos los números que Apollo y Lusha devuelven, pero el drawer
      # seguía enseñando exactamente uno: el escalar del candidato. Los números
      # adicionales —ya observados, ya pagados, ya persistidos— no tenían ninguna
      # superficie donde leerse, así que la operación pagaba por ellos y no podía
      # usarlos.
      #
      # QUÉ SE PROTEGE AQUÍ:
      #   * COSTE CERO, que es el contrato central: abrir el disclosure no llama a
      #     Apollo, no llama a Lusha, no crea corridas, no reserva créditos, no
      #     escribe usage logs y no toca el estado del reveal. Las guardas estáticas
      #     verifican que esas llamadas NO ESTÉN ESCRITAS en el camino nuevo — un
      #     test de comportamiento sólo probaría que hoy no se hicieron;
      #   * SÓLO LECTURA: el módulo de acceso no contiene `.insert`/`.update`/
      #     `.delete`/`.upsert` ni una sola `.rpc()`. En particular NO invoca las
      #     funciones de 110/111/112/113, que son transaccionales y escriben;
      #   * READ ERROR ≠ CALL PROVIDER: si la lectura falla, la UI lo dice y no
      #     ofrece ningún camino alterno que gaste. Cubierto con un `unavailable`
      #     del servidor y con una excepción cruda de la acción;
      #   * PRIVACIDAD: una fila con `suppressed_at` no se muestra ni enmascarada;
      #     la consulta pide columnas explícitas (nunca `*`) y no trae
      #     `suppression_reason`/`suppressed_by`; la proyección al navegador tiene
      #     EXACTAMENTE cinco campos y ninguna `dedupe_key`, id de corrida, de
      #     reserva, de usage log ni de persona del proveedor; ningún número se
      #     imprime en consola;
      #   * FLAGS: `ENABLE_PHONE_REVEAL_WATERFALL` (false en Producción) y
      #     `ENABLE_LUSHA_PHONE_REVEAL_FALLBACK` NO gobiernan esta lectura. Un
      #     número ya pagado y ya guardado no puede volverse invisible porque el
      #     proveedor que lo trajo esté hoy apagado: disponibilidad operativa del
      #     proveedor ≠ visibilidad del dato almacenado;
      #   * AUTORIZACIÓN de servidor: las DOS acciones exigen rol `admin` antes de
      #     leer, y la lectura con service role no lleva 'use server', así que no
      #     puede convertirse en un endpoint. Que el botón no se pinte no es la
      #     protección;
      #   * CORRECCIÓN de la proyección: mismo número visto por Apollo y por Lusha ⇒
      #     UNA fila con DOS fuentes (nunca duplicado); el principal no se repite
      #     como «adicional» ni cuando la fila no está marcada pero contiene el
      #     mismo número que el escalar; orden canónico por tipo, no el orden físico
      #     de la base;
      #   * COPY: el verbo es VER. «Buscar», «Encontrar», «Revelar» y «Enriquecer»
      #     están prohibidos porque prometerían una consulta que cuesta, y no se
      #     muestra costo por número (las respuestas se cobran POR RESPUESTA, así
      #     que un precio unitario sería una cifra que nadie facturó);
      #   * ALCANCE: 0 migraciones, 0 cambios en proveedor/presupuesto/reservas/
      #     waterfall, 0 en aprobación y 0 en contactos, verificado contra
      #     `origin/main...HEAD`.
      #
      # Mutantes detectados: el filtro de tombstone desaparece; la proyección
      # empieza a llevar `dedupe_key`; el CTA se ata al flag del waterfall; el
      # estado de error cae a un reveal; `select('*')`; el principal vuelve a
      # listarse como adicional.
      #
      # Determinista y offline: sin red, sin Supabase real, sin proveedores, 0
      # créditos. La suite de UI va aparte porque necesita
      # `--experimental-test-module-mocks`.
      - name: Run stored candidate phones tests
        run: npm run test:agent2a:stored-candidate-phones

      - name: Run stored candidate phones UI tests
        run: npm run test:agent2a:stored-candidate-phones-ui

      # AGENT2A-PHONE-REVEAL-4O-H1 — el esquema OFICIAL de múltiples teléfonos
      # (`contact_phones` + `contact_phone_sources`, migración 114), creado INERTE.
      #
      # Qué fija esta suite, que es lo único que un diff futuro no puede recordar:
      #   * INERCIA: 0 lectores y 0 escritores en runtime, 0 backfill, 0 UI, 0 RPC,
      #     0 funciones, ningún trigger de negocio y ninguna fila insertada. La
      #     aprobación de candidatos, `createContact` y `updateContact` no nombran
      #     las tablas: la propagación es H3 y la convergencia manual es H5;
      #   * VOCABULARIOS pinneados en AMBAS direcciones contra
      #     `phone-collection-core.ts`, para que un valor no pueda añadirse en un
      #     solo lado y producir un 23514 en ejecución — el defecto de #238;
      #   * UNA sola taxonomía de privacidad: el motivo de supresión es el de la
      #     109 carácter por carácter, y el de caché/auditoría de la 099 se rechaza
      #     (los dos conjuntos comparten CERO valores);
      #   * IDENTIDAD oficial: la FK es a `contacts`, nunca a un candidato, y NO hay
      #     `account_id` — `contacts.account_id` ya define la propiedad y una segunda
      #     copia sólo podría contradecirla;
      #   * DINERO: ninguna columna de coste/crédito/precio. Los punteros a
      #     `phone_reveal_waterfall_runs` / `..._credit_reservations` /
      #     `provider_usage_logs` son punteros de auditoría, no importes;
      #   * PRIVILEGIOS: `authenticated` sólo SELECT (un navegador no puede declarar
      #     procedencia); DELETE y TRUNCATE a NADIE (borrar un tombstone
      #     desbloquearía el número suprimido); la procedencia es inmutable porque
      #     el UPDATE de `contact_phone_sources` es POR COLUMNA y sólo alcanza la
      #     tríada de supresión;
      #   * RLS derivada del CONTACTO padre vía EXISTS, no una segunda copia de
      #     `has_active_access` que divergiría el día que `contacts` gane alcance
      #     por cuenta.
      #
      # Mutantes detectados: un archivo de producción empieza a nombrar las tablas;
      # aparece una columna de coste; aparece `account_id`; se concede DELETE; el
      # encabezado afirma estar aplicada en Producción; `phone_type` gana un miembro
      # coloquial; se añade un trigger de negocio.
      #
      # Determinista y offline: sólo lee archivos del disco. Sin red, sin Supabase,
      # sin proveedores, 0 créditos, y NO toca Producción.
      #
      # ⚠️ La suite de PostgreSQL REAL queda FUERA de este check a propósito, igual
