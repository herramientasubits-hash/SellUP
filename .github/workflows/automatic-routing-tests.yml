      # ADDENDUM PROVIDER-SEEN — la memoria de lo que un proveedor de pago YA nos
      # mostró, independiente de `prospect_candidates`.
      #
      # El defecto que esta suite defiende: hoy la única huella que queda de una
      # empresa devuelta por un proveedor vive DENTRO del candidato persistido
      # (`source_trace.providerCompanyId`, medido 66/66 en Lusha y 0/10 en Apollo).
      # Recordamos exactamente lo que no hacía falta recordar y olvidamos lo que sí
      # —rechazada por macro, duplicado exacto, candidato histórico activo, sobrante
      # de objetivo—, así que la corrida siguiente vuelve a pagarlo.
      #
      # Lo que se comprueba, dicho como defecto:
