      - name: Run A1 provider-seen memory tests
        run: npm run test:a1-provider-seen-memory

      # ── AGENT1-PROVIDER-SEEN-MEMORY-2 ───────────────────────────────────
      #
      # LA MITAD QUE NINGUNA SUITE DE TypeScript PUEDE CUBRIR.
      #
      # La afirmación central de este hito es de IDENTIDAD —qué cuenta como «la misma
      # empresa» para la memoria de lo ya pagado— y esa afirmación NO vive en
      # TypeScript: vive en dos índices únicos PARCIALES y en un `ON CONFLICT ... DO
      # UPDATE` con mezcla ordenada. Leer el SQL no responde si PostgreSQL acepta el
      # duplicado; hay que insertarlo.
      #
      # Aplica la migración 123 leyendo el archivo VERBATIM de `supabase/migrations` y
      # después ejercita, con el nombre del caso en el título, los cinco que la dueña
      # pidió resolver antes de congelar el esquema:
      #   A. dominio suelto y luego id+dominio  ⇒ DOS filas (fusionarlas exigiría afirmar
      #      que un dominio identifica una entidad, justo lo que C prohíbe);
      #   B. mismo id con dominio nuevo         ⇒ UNA fila, `first_seen_*` intacto y el
      #      dominio avanzado al que el proveedor emite AHORA;
      #   C. ids distintos con dominio compartido ⇒ DOS filas — no hay unicidad global
      #      por dominio, que colapsaría un grupo con su filial;
      #   D. id solo y luego id+dominio         ⇒ UNA fila, el dominio se COMPLETA, y un
      #      nulo posterior nunca lo borra;
      #   E. la misma observación concurrente dos veces ⇒ UNA fila, sin excepción visible.
      #
      # Y lo que sólo una base real puede responder: que la migración APLIQUE (cinco
      # `COMMENT ON` y una función plpgsql con dolar-quoting anidado son exactamente la
      # superficie donde un lexer de comillas pasa y PostgreSQL falla con 42601); que
      # reaplicarla no toque una fila; que `first_seen_*` y la identidad sean inmutables
      # ante un UPDATE DIRECTO; que anon y authenticated no conserven NI UNO de los 8
      # privilegios —Supabase los concede por DEFAULT PRIVILEGES y habilitar RLS no los
      # quita, así que esto se responde con `has_table_privilege`, no con
      # `information_schema`—; que `service_role` no tenga DELETE; y que el doble en
      # memoria de las pruebas converja a la MISMA fila que la tabla, que es la única
      # defensa contra que el esquema y su cliente acaben con dos ideas de identidad.
      #
      # 🔴 La migración NO se aplica en Producción y el runtime sigue devolviendo el
      # no-op: este paso prueba la tabla, no la enciende.
      #
      # `embedded-postgres` ya está instalado por el paso de Agente 2A de más arriba, con
      # la versión PINCHADA 17.6.0-beta.15. `SELLUP_REQUIRE_POSTGRES_HARNESS` convierte
      # el skip en FALLO: sin ella, que el arnés no resolviera pondría este paso verde
      # con una migración inaplicable. Sin `continue-on-error` y sin `|| true`.
      #
      # 0 proveedores, 0 créditos, 0 escrituras remotas. Datos sintéticos.
      - name: Run A1 provider-seen schema tests against real PostgreSQL
        run: npm run test:a1-provider-seen-memory:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'
      # AGENT2A-APOLLO-PEOPLE-SEARCH-BILLING-TRUTH-1 — la verdad contable de
      # Apollo People Search entra al check obligatorio.
      #
      # El soporte de Apollo confirmó que People Search no cobra: ni la llamada, ni
      # los resultados devueltos, ni los resultados repetidos. SellUp escribía
      # `credits_used = número de resultados` con su dólar derivado del precio genérico
      # del crédito, así que contabilizaba como pagado un volumen que el proveedor
      # regala (30 filas históricas en Producción con 98 créditos y ~$0.8575 que NO son
      # cobros probados).
      #
      # Lo que esta suite defiende, dicho como defecto:
      #   * que un conteo de VOLUMEN vuelva a colarse como costo — se comprueba sobre
      #     el adaptador REAL y, en el runner, con entradas HOSTILES que reportan
      #     `creditsUsed = nº de resultados` y con `providerUsage` AUSENTE (las dos
      #     ramas por las que entraron los créditos fantasma);
      #   * que el costo cero se coma las métricas operativas: 25 resultados gratis
      #     siguen siendo 25 en `results_returned` y en la metadata;
      #   * que una llamada real a costo cero se vuelva indistinguible de "no se llamó
      #     al proveedor" — la fila de éxito con 0 resultados tiene que existir;
      #   * que el 0 se escriba como NULL, que significa "costo DESCONOCIDO" y no
      #     "gratis", y que el presupuesto lo lea como incompleto;
      #   * que el cero se generalice y regale `people/match`, que sigue siendo pagado.
      #
      # Offline y determinista: sin red (un espía sobre `fetch` lo comprueba), sin
      # Supabase, sin credenciales. 0 créditos.
      - name: Run Agent 2A Apollo People Search billing truth tests
        run: npm run test:agent2a:apollo-people-search-billing-truth
      # AGENT2A-PROVIDER-NOVELTY-AND-REUSE-GATE-1 — el novelty gate PRE-PAGO
      # de identidades nativas del proveedor entra al check obligatorio.
      #
      # El defecto que cierra: un rerun AUTOMÁTICO de descubrimiento de contactos
      # volvía a pagar por enriquecer a la MISMA persona, en la MISMA empresa, por
      # el MISMO proveedor. Apollo People Search no cobra y no permite excluir
      # personas ya vistas, así que el desperdicio estaba en `people/match`; en
      # Lusha, en `/v3/contacts/enrich`.
      #
      # Lo que esta suite defiende, dicho como defecto:
      #   * que una identidad ya conocida vuelva a entrar a la pata PAGADA
      #     (`people/match` / `/v3/contacts/enrich`) o a crear un candidato duplicado;
      #   * que el estado del candidato histórico reabra el pago: pending_review,
      #     approved, discarded y duplicate cuentan TODOS como ya visto, y un
      #     candidato al que le falta el email tampoco se vuelve pagable solo;
      #   * que la identidad se cruce entre proveedores — un contactId de Lusha no
      #     puede suprimir un person_id de Apollo, ni al revés;
      #   * que el scope de empresa se afloje: solo account_id, HubSpot company id o
      #     dominio normalizado, nunca el NOMBRE ni un match difuso; y que la misma
      #     persona en OTRA empresa siga siendo elegible (cambia de empleador);
      #   * que el gate se vuelva fail-closed: sin clave determinista, sin identidad
      #     o con error de lectura NO puede suprimir nada;
      #   * que el ahorro se cuele como llamada inventada: un skip no escribe fila de
      #     provider_usage_logs, ni créditos, ni USD; y People Search sigue en 0/0;
      #   * que la barrera tardía de duplicados (dedupe + pending cross-run) se
      #     retire por tener un gate temprano.
      #
      # Offline y determinista: `fetch` está sustituido por un router en memoria que
      # falla el test si aparece cualquier host que no sea el fixture de Lusha o el
      # Supabase de marcador. Sin credenciales, sin Supabase real, 0 créditos.
      - name: Run Agent 2A provider-native novelty gate tests
        run: npm run test:agent2a:provider-novelty-gate
      # AGENT2A-LOCAL-REVIEWABLE-CANDIDATE-REUSE-1.1 — el gate de REUSO LOCAL
      # pre-proveedor, AGNÓSTICO DE PROVEEDOR, entra al check obligatorio.
      #
      # El defecto que cierra: con el intento de Apollo en cero candidatos
      # revisables, el router AUTOMÁTICO arrancaba trabajo específico de Lusha
      # (disponibilidad → API key → presupuesto → attempt #2 → Prospecting)
      # incluso cuando SellUp YA tenía un candidato accionable de la MISMA
      # empresa esperando revisión en pending_review. El resultado revisable ya
      # existía; el proveedor no tenía nada que añadir que un humano no hubiera
      # visto todavía.
      #
      # LA FUGA QUE CIERRA LA VERSIÓN 1.1 — y el motivo de que el predicado NO
      # pueda ser sólo source='lusha'. La señal de fallback se deriva de
      # attempt1Result.candidatesCreated, y #315 quita los person_id de Apollo YA
      # CONOCIDOS ANTES del /people/match pagado. Por eso una corrida repetida
      # llega legítimamente a candidatesCreated=0 ⇒ zero_reviewable_candidates
      # ⇒ el router recomienda fallback a Lusha, MIENTRAS SellUp ya tiene un
      # candidato APOLLO accionable en pending_review para esa misma empresa. Con
      # el predicado Lusha-only ese candidato se ignoraba y el gasto de Lusha
      # seguía siendo posible. El test contrafactual (9) es exactamente esa fuga.
      #
      # LO QUE ESTO NO ES: identidad cruzada entre proveedores. No se afirma que
      # un person_id de Apollo sea un contactId de Lusha, no se crea alias, no se
      # traduce ningún id nativo, y ninguna fila de un proveedor suprime un id
      # concreto del otro. La pregunta es de EMPRESA: "¿ya hay al menos un
      # candidato accionable de esta misma empresa esperando revisión humana?".
      # Los valores de source_contact_id NUNCA se comparan entre sí.
      #
      # Lo que esta suite defiende, dicho como defecto:
      #   * que la colocación se degrade: el gate tiene que correr DESPUÉS de que
      #     la señal recomiende fallback y ANTES de isFallbackProviderAvailable,
      #     de estimateFallbackCostUsd/presupuesto, de createFallbackAttempt y de
      #     runLushaAttempt — se comprueba con el ORDEN de llamadas, no solo con
      #     contadores;
      #   * que un resultado LOCAL y GRATIS se rechace por una condición del
      #     proveedor: se prueba con Lusha no disponible, sin API key, con un
      #     presupuesto que SÍ bloquearía un fallback y con costo desconocido;
      #   * que el contrato accionable se afloje: source IN ('apollo','lusha') +
      #     source_contact_id + pending_review + email + duplicate_status
      #     'no_match'; LinkedIn es OPCIONAL;
      #   * que un estado SUPPRESS-ONLY se cuele como reuso — approved,
      #     discarded, duplicate, possible_duplicate, exact_duplicate, unchecked
      #     y pending_review sin email NO satisfacen el umbral, en NINGUNO de los
      #     dos sources, y tampoco disparan un re-enriquecimiento directo por
      #     contactId;
      #   * que un candidato de Apollo NO cuente: un pending_review accionable de
      #     Apollo de la misma empresa TIENE que producir HIT (era la fuga);
      #   * que source_contact_id deje de exigirse: una fila sin identidad nativa
      #     del proveedor (manual/fabricada) NO es reusable;
      #   * que source_counts mienta: los conteos por source son agregados y
      #     veraces, y no llevan ids, email ni LinkedIn;
      #   * que aparezca comparación de identidad entre proveedores: se prueba
      #     que el gate nunca compara valores de source_contact_id;
      #   * que el scope de empresa se afloje: se reutilizan los helpers de #315
      #     (account_id > HubSpot company id > dominio normalizado), sin NOMBRE ni
      #     match difuso, y un desacuerdo en la clave más fuerte NO cae a una más
      #     débil;
      #   * que el gate se vuelva fail-CLOSED: sin clave determinista, request
      #     ilegible o error de lectura tienen que dejar pasar el fallback actual
      #     INTACTO;
      #   * que el ahorro se cuele como llamada inventada: 0 filas de candidato,
      #     0 filas de provider_usage_logs, y la telemetría NO afirma
      #     avoided_paid_calls / credits_saved / USD_saved;
      #   * que candidatesCreated se contamine: reusedExistingCandidates es un
      #     contador SEPARADO y no existe ningún conteo "efectivo" combinado;
      #   * que el flag por defecto deje de estar APAGADO, y que con el flag
      #     apagado el lector llegue a ejecutarse.
      #
      # Offline y determinista: cada lector y cada dependencia del router se
      # inyecta. Sin red, sin Supabase, sin credenciales, 0 créditos. Reejecuta
      # además las suites de routing automático, de la decisión de fallback, del
      # action core y del contrato de config para probar que nada existente
      # cambió de comportamiento.
      - name: Run Agent 2A local reviewable candidate reuse gate tests
        run: npm run test:agent2a:local-reuse-gate

      # AGENT1-APOLLO-BENCHMARK-PARITY-CUT-1 — la economía de Apollo company
      # discovery deja de ser inmedible, y su memoria deja de ser ciega.
      #
      # Cuatro defectos, un solo check obligatorio:
      #
      #   P0-2 — Apollo NO recordaba nada de lo que devolvía. La memoria
      #          provider-seen sólo la escribía Lusha, así que cada corrida Apollo
      #          volvía a pagar empresas que ya había visto. Ahora se registra en
      #          la costura COMPARTIDA por sus dos modalidades
      #          (`apollo-organizations-paginated-search`), inmediatamente después
      #          de normalizar y ANTES del dedupe entre páginas y del tope
      #          `maxCandidates`.
      #   P0-4 — la contabilidad agregada salía de `paginated.organizations`, que
      #          ya está deduplicada y truncada. Dos páginas de 10 con tope 10 se
      #          registraban como 10 resultados pagados en vez de 20. Ahora sale
      #          del ledger POR PÁGINA.
      #   P1-1 — un `estimated_cost_usd` explícitamente null —«no había tarifa
      #          viva»— se colapsaba a 0 en la fila de Apollo, mientras la misma
      #          fila llevaba `pricing_missing_warning: true` al lado. Ahora se
      #          preserva como SQL NULL, igual que la ruta Lusha.
      #   P1-3 — no existía embudo comparable con el de Lusha. Ahora existe, y los
      #          tres campos que esta ruta todavía no puede medir van en null con
      #          su costura NOMBRADA, jamás en 0.
      #
      # Las mutaciones que esta suite pone en rojo:
      #   * mover el registro de memoria después del tope de candidatos;
      #   * moverlo después del dedupe entre páginas;
      #   * devolver el agregado a `rawOrgs.length` / `collected.length`;
      #   * volver a colapsar un null explícito de costo en 0;
      #   * fabricar `accepted_for_target` desde lo devuelto por el proveedor;
      #   * volver fail-CLOSED la escritura de memoria (una página YA pagada no se
      #     puede perder por un fallo de memoria).
      #
      # Y los ratchets de ALCANCE: P0-3 sigue fuera —ni `residualGap`, ni plan de
      # exclusión, ni memoria cargada antes de buscar—, `APOLLO_EXCLUSION_CAPABILITY`
      # sigue TODA en false, no hay flag nuevo, no hay migración nueva, y la ruta
      # Lusha conserva su orden y su aislamiento de identidad.
      #
      # Offline y determinista: transporte, reloj, jitter, logger y escritor de
      # memoria se inyectan. Sin red, sin Supabase, sin proveedor. 0 créditos.
      - name: Run A1 Apollo benchmark parity cut 1 tests
        run: npm run test:a1-apollo-benchmark-parity-cut1

      # BR-SOURCE-GATE-ROUND-1 (FINAL CORRECTION) — los tres registros de decisión
      # y el bloqueador CNPJ del snapshot.
      #
      # Lo que esta suite congela:
      #
      #   · GATE-2 tiene su sobre numérico COMPLETO (los diez techos, incluidos los
      #     tres que antes no tenían número de dueño) pero sigue `needs_owner_confirmation`,
      #     no `approved`: la disposición de privacidad del ordinal de cubeta NO
      #     tiene fuente de dueño atribuible, y NO enciende nada — la constante
      #     rastreada de política de almacenamiento temporal sigue en `false` y la
      #     propuesta provisional de topes sigue con `maxTemporaryStorageBytes: 0`,
      #     ambas verificadas contra su módulo DUEÑO, no contra la copia del registro;
      #   · GATE-3 registra una POLÍTICA y sigue CERRADO, con DOS bloqueadores
      #     residuales presentes y sin resolver (RB-1 pertenece a GATE-4; RB-3 son
      #     los cuatro campos sin etiquetar) — RB-2 (el hash de CNPJ como
      #     diagnóstico de rechazo) queda CERRADO por este mismo workstream;
      #   · GATE-8 es `APPROVED_AS_CONTRACT` y declara `authorizesOperations: false`;
      #     el módulo no tiene NI UN import, que es lo que hace imposible que
      #     encienda algo;
      #   · el veredicto de artefacto completo sigue `invalid` / `NO_GO` — correcto
