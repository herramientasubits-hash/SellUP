      # Offline y determinista: transporte, reloj, jitter, logger, escritor de
      # memoria y capa gratuita se inyectan. Sin red, sin Supabase, sin proveedor.
      # 0 créditos.
      - name: Run A1 Apollo benchmark parity cut 2 tests
        run: npm run test:a1-apollo-benchmark-parity-cut2

      # AGENT1-LUSHA-MIXED-TWO-BATCH-CONTAINMENT-1 §§ 2, 4, 5, 6, 7 — el RATCHET
      # DE CABLEADO VIVO de la superficie Lusha.
      #
      # El defecto que contiene estaba VIVO en Producción, no era hipotético: la
      # superficie Lusha llamaba a la capa gratuita compartida con
      # `partialGapSupported: true` mientras su ejecutor de pago NUNCA adopta el
      # lote de esa capa. Objetivo 5 y 3 empresas gratis ⇒ lote A gratuito
      # (`source = agent_1`, `source_primary = public_source`) + lote B pagado, y
      # el resultado devuelto apunta al segundo. La invariante de sistema se
      # cumple (3 + 2 <= 5); el resultado ÚNICO del producto, no. Y a diferencia
      # de la ruta del wizard con Apollo, esta superficie tampoco tiene el ancla
      # durable de idempotencia/lote que el diseño de lote único necesita.
      #
      # Lo que esta suite congela:
      #
      #   · el valor VIVO es `false`, y su dueño único es
      #     `LUSHA_PENDING_REVIEW_PARTIAL_GAP_SUPPORTED` (§§ 4, 5);
      #   · aporte gratuito PARCIAL ⇒ 0 escrituras de la capa gratuita, 0 lotes
      #     gratuitos, y la ruta de pago corre con el objetivo COMPLETO (§ 7);
      #   · lo gratuito que cierra el objetivo ENTERO sigue persistiendo y
      #     dejando `providerRequired: false` — la propiedad probada en
      #     Producción NO se toca (§ 6);
      #   · el early-return gratuito queda por ENCIMA de estimación, reserva,
      #     credencial y petición, que es lo que hace verdad el «0 reservas, 0
      #     llamadas» (§ 6);
      #   · el descarte se lleva la CONTRIBUCIÓN y jamás la MEDICIÓN: memoria
      #     provider-seen y dominios de exclusión de Lusha sobreviven (§§ 3, 8);
      #   · REVIEW-1 §§ 3, 4, 9 — y la MEDICIÓN concuerda con el ENVÍO: el plan
      #     de exclusión que la puerta resolvió se ARRASTRA por el descarte en vez
      #     de reconstruirse vacío, así que `provider_exclusion_domains_sent` deja
      #     de publicar 0 sobre un envío real de 3 en la ruta Lusha. El ratchet que
      #     antes fijaba ese efecto abierto está INVERTIDO: ahora exige el acuerdo.
      #     Apollo no gana ni una exclusión enviada (`sent` sigue en 0 por
      #     capacidad apagada); lo único que cambia en su ruta es que sus contadores
      #     de «lo que se sabía» dejan de estar en 0, y eso también está pinchado.
      #
      # 🔴 Y el contraste que impide leer contención como amputación: la MISMA
      # capa gratuita y el MISMO runner, invocados a propósito con `true`,
      # siguen produciendo hueco residual 2 y lote gratuito escrito.
      #
      #   LUSHA_PARTIAL_GAP_CAPABILITY      = PRESENT
      #   LUSHA_PARTIAL_GAP_LIVE_ACTIVATION = OFF
      #
      # Voltear la constante (12 pruebas ROJAS), reescribir el literal en el sitio
      # de la llamada (2 pruebas ROJAS) o reconstruir el plan de exclusión vacío en
      # la ruta de descarte (4 pruebas ROJAS) pone esta suite en ROJO.
      #
      # Ratchets de alcance que siguen vivos: `WIZARD_APOLLO_PARTIAL_GAP_SUPPORTED`
      # en `false` y sin tocar, Tavily sin cambios, `exclude.ids` congelado, y
      # `LUSHA_CONTRACT_STILL_UNCONFIRMED` sigue en true. Sin flag nuevo, sin
      # migración, sin cambio de facturación ni de reservas.
      #
      # Offline y determinista: sólo se doblan los dos bordes de I/O del runner
      # (`runGate`, `persist`). Sin red, sin Supabase, sin Lusha, sin Apollo.
      # 0 créditos.
      - name: Run A1 Lusha mixed two-batch partial-gap containment tests
        run: npm run test:a1-lusha-partial-gap-containment
      # AGENT1-MIXED-FREE-PAID-SINGLE-BATCH-1 · CUT-1 — la SUPERVIVENCIA del lote
      # entra al check obligatorio.
      #
      # El defecto que cierra (P0 G2): el estado terminal del lote se calculaba
      # sólo con el resultado del ÚLTIMO contribuyente. Un lote que ya contenía,
      # por ejemplo, 7 candidatos gratuitos durables pasaba a `failed` o a
      # `completed` porque el escritor de pago insertó 0 o porque el pipeline
      # murió después. El fallo del proveedor era cierto; el estado del LOTE, no,
      # y esas 7 filas dejaban de anunciarse como algo que revisar.
      #
      # Lo que esta suite defiende, dicho como defecto:
      #   * que un lote con filas durables vuelva a degradarse a `failed` o a
      #     `completed` porque un contribuyente posterior escribió 0 —se comprueba
      #     en los DOS caminos: el resolutor de estado del escritor y
      #     `markWizardBatchFailed`, y también sobre el escritor REAL con un
      #     cliente admin falso;
      #   * que se pierdan los seis casos previos: lote vacío + fallo sigue
      #     `failed`, y cero limpio sigue `completed`;
      #   * que «no se pudo determinar cuántas filas hay» se convierta en «hay
      #     cero» — una sonda ilegible NO escribe estado terminal, ni inventa
      #     `ready_for_review` ni afirma `failed`;
      #   * que el total se cuente dos veces: las filas previas se leen ANTES del
      #     bucle de inserción y la telemetría publica las dos cifras separadas;
      #   * que un reintento con cero inserciones nuevas degrade un lote que ya
      #     sobrevivió (idempotencia y monotonicidad);
      #   * que el criterio de fila durable se ate al filtro de UI
      #     `isUsefulReviewCandidate`, que oculta candidatos CO reales;
      #   * que este hito encienda el hueco parcial: Apollo y Lusha siguen en
      #     `false`, y el módulo nuevo no nombra proveedores, créditos ni
      #     presupuesto.
      #
      # Offline y determinista: sin Supabase, sin red, sin credenciales,
      # 0 créditos, 0 migraciones.
      - name: Run Agent 1 mixed free+paid batch survival tests
        run: npm run test:a1-mixed-batch-survival

      # AGENT1-MIXED-FREE-PAID-SINGLE-BATCH-1 · CUT-2 — BATCH TRUTHFULNESS.
      #
      # CUT-1 defendió que un contribuyente posterior no pueda BORRAR el
      # contenido durable de un lote. Este paso defiende lo adyacente: que no
      # pueda REDEFINIR la petición que lo creó.
      #
      # Impide que vuelvan:
      #   * que el OBJETIVO GLOBAL lo establezca un residual: la reserva durable
      #     escribe ahora `target_count = 10` —el objetivo PERSISTIBLE, no la
      #     amplitud de búsqueda 25— antes de que exista contribuyente alguno, y
      #     con ella el país, el ISO, la industria y la profundidad;
      #   * «gana el último que escribe» sobre las cinco columnas de identidad
      #     global — con hueco mixto (10 pedidos, 7 gratis, 3 de pago) el
      #     contribuyente de pago escribía `target_count = 3` encima del 10 del
      #     usuario, y su país / industria encima de los del wizard;
      #   * la regresión inversa: `name` es etiqueta de PRESENTACIÓN, así que el
      #     rótulo técnico de la reserva —`Wizard: {industryId} / {countryCode}`—
      #     NO puede quedar visible después de que el escritor adopte el lote;
      #   * el `{ ...existingMeta, ...batchMetadata }` en el que el contribuyente
      #     actual ganaba TODA colisión de metadata, incluidas las dos reales de
      #     hoy: `run_provider_selection` y `apollo_discovery_taxonomy`, que
      #     escribe también la reserva del wizard y cuya versión es SUPERCONJUNTO;
      #   * la SUPLANTACIÓN: los dos canales de metadata —bloque propio del
      #     escritor y paso a través del llamador— llegan SEPARADOS hasta la
      #     resolución de dueño. Recombinarlos antes dejaba que un valor de paso
      #     a través heredase autoridad de escritor con sólo coincidir en el
      #     nombre de una de sus claves;
      #   * que una clave sin dueño probado se pise en silencio, o que el bloque
      #     de origen gratuito lo borre el de pago;
      #   * que proteger la adopción vacíe de campos a los lotes NUEVOS: la ruta
      #     de creación sigue poblando nombre, país, industria, objetivo,
      #     profundidad, estado, source y metadata como siempre;
      #   * que un reintento mute progresivamente la verdad del lote;
      #   * que este hito encienda el hueco parcial: Apollo y Lusha siguen en
      #     `false`, y el módulo nuevo es puro (sin I/O, sin proveedores, sin
      #     créditos, sin presupuesto).
      #
      # Offline y determinista: sin Supabase, sin red, sin credenciales,
      # 0 créditos, 0 migraciones.
      - name: Run Agent 1 mixed free+paid batch truthfulness tests
        run: npm run test:a1-mixed-batch-truthfulness
      # AGENT2A-WATERFALL-DEFAULT-REVEAL-BEHAVIOR-1 — el waterfall Apollo → Lusha
      # es el comportamiento NORMAL del botón «Revelar teléfono», no un privilegio
      # de rol.
      #
      # El defecto de Product que corrige: la autorización de ROL partía el
      # producto en dos flujos. El waterfall tenía una lista de roles PROPIA y más
      # estrecha (`['admin']`), así que un `commercial_manager` —que SÍ puede
      # revelar teléfono— se quedaba en Apollo-only y nunca alcanzaba la 2ª pata.
      # El rol debe decidir SI el actor puede revelar; QUÉ flujo corre lo decide
      # el flag `ENABLE_PHONE_REVEAL_WATERFALL`, que sigue siendo el master switch.
      #
      # Lo que este paso impide que vuelva, dicho como defecto:
      #   * que nazca una SEGUNDA lista de roles para el waterfall. La autoridad es
      #     una sola (`phone-reveal-authorized-roles.ts`) y se afirma rol por rol
      #     que `WATERFALL_ALLOWED(actor) === PHONE_REVEAL_ALLOWED(actor)`;
      #   * que ensanchar el waterfall abra el reveal a un rol que NUNCA pudo
      #     revelar: `seller`, `seller_bd`, `lead` y el actor sin rol siguen
      #     bloqueados, sin leer el candidato y sin consultar el presupuesto;
      #   * que ensanchar el waterfall arrastre de rebote a «Buscar más números»,
      #     que es una compra ADICIONAL y conserva su propia lista admin-only en
      #     vez de heredar la del waterfall;
      #   * que el copy MIENTA sobre el tope. El drawer clasificaba con una regla
      #     propia —«el candidato nació en Lusha y trae su id»— que no conoce las
      #     identidades ya persistidas (migración 124) ni si hay datos con los que
      #     buscar, así que un candidato Apollo con email y LinkedIn leía «hasta 8
      #     créditos» mientras el arranque reservaba 14. Ahora la modalidad la
      #     resuelve el MISMO core puro que reserva, y se afirma caso por caso que
      #     el número mostrado y el enviado coinciden (8 / 13 / 14);
      #   * que se INVENTE un 14 donde la búsqueda no se puede ejecutar: sin
      #     identificador exacto el tope es 8, con identidad persistida es 13, y si
      #     el servidor no contesta (flag apagado, rol no autorizado, 124 sin
      #     aplicar) el copy cae al conservador y jamás promete la búsqueda;
      #   * que un token de servicio convierta una autorización inválida en una
      #     llamada pagada: la pata Lusha recibe el `authorized_by_role` de la
      #     corrida y lo revalida contra la autoridad canónica antes de llamar;
      #   * que la ruta legacy solo-Lusha quede admin-only o recobre Apollo: todo
      #     rol autorizado la reautoriza, con tope 5, `apollo_attempted_at = null`
      #     y sólo el pozo de Lusha consultado;
      #   * y que el contrato de crédito de la 124 se mueva: 1 (búsqueda) / 5
      #     (teléfono) / 8 (Apollo) / 13 / 14, con cada total igual a la suma de
      #     sus patas y el umbral de la búsqueda en 14.
      #
      # Offline y determinista: deps inyectadas y server actions mockeados. Sin
      # red, sin Supabase, sin Apollo, sin Lusha, 0 créditos, 0 migraciones.
      #
      # R2 añade el contrato del TECHO DE LA AUTORIZACIÓN HUMANA. El defecto que
      # impide que vuelva, dicho como secuencia: la vista previa falla ⇒ el botón
      # ofrece «hasta 8 créditos» ⇒ la persona autoriza 8 ⇒ el clic envía 8 ⇒ el
      # servidor resuelve la modalidad REAL (14) y reservaba 14, porque la única
      # validación que existía comparaba contra la pata de Apollo (8), no contra la
      # modalidad. Se reservaba un máximo que nadie aprobó.
      #
      # Lo que este paso fija ahora:
      #   * el techo aceptado es un LÍMITE SUPERIOR DURO y se compara ANTES del
      #     preflight de presupuesto y de `reserve_and_create_phone_reveal_run`:
      #     aceptado < requerido ⇒ 0 consultas de pozo, 0 reservas, 0 corridas, 0
      #     Apollo, 0 Lusha, 0 usage-logs, 0 créditos. La prueba de ORDEN es que no
      #     se consulta ni un pozo: mover la comparación detrás de la reserva la
      #     rompe aunque el desenlace visible siga siendo un bloqueo;
      #   * reservar-y-liberar NO es equivalente y no se acepta como arreglo;
      #   * aceptar de MÁS se permite, pero lo que se RESERVA sigue siendo lo
      #     requerido (aceptar 14 sobre una modalidad de 13 registra 13);
      #   * omitir el techo equivale al suelo de 8, jamás a la modalidad requerida;
      #   * el rechazo NO degrada a Apollo-only —gastar 8 tampoco estaba autorizado
      #     bajo esa lectura— y NO se reintenta solo: la UI recarga su vista previa,
      #     muestra «la autorización cambió» y el siguiente clic es de la persona;
      #   * y la ruta legacy solo-Lusha conserva su tope 5: este cambio no puede
      #     convertir una autorización legacy en una de 13/14.
      - name: Run A2A waterfall default reveal behavior tests
        run: npm run test:agent2a:waterfall-default-reveal-behavior

      # ── AGENT2A-WATERFALL-NO-SILENT-DOWNGRADE-1 ────────────────────────────
      #
      # Check OBLIGATORIO. Cierra la degradación SILENCIOSA a Apollo-only: una QA
      # real autorizó en la UI un waterfall de 14 créditos, Apollo entregó el
      # teléfono… y quedaron 0 corridas, 0 reservas y un usage-log del START sin
      # `phone_reveal_waterfall_id`. Lo que se fija:
      #
      #   * `no_waterfall` significa UNA sola cosa —el flag maestro
      #     ENABLE_PHONE_REVEAL_WATERFALL estaba APAGADO— y es el único estado que
      #     deja continuar el reveal Apollo legacy;
      #   * con el flag ENCENDIDO, la corrida es PRECONDICIÓN del gasto: los seis
      #     motivos que antes se colapsaban en `no_waterfall` (feature_disabled,
      #     role_not_allowed, invalid_candidate, candidate_not_found,
      #     active_run_exists, create_conflict) BLOQUEAN con 0 Apollo, 0 Lusha,
      #     0 reservas, 0 usage-logs y 0 créditos;
      #   * flag exterior ON + core `feature_disabled` es una INVARIANTE ROTA, no
      #     un estado de producto: fail-closed con su propio errorCode;
      #   * una autorización viva (o un 23505 en paralelo) NO abre una segunda
      #     llamada a proveedor: la corrida existente ES la autorización;
      #   * el evento de arranque es estructurado y SIN PII —booleanos, enteros y
      #     motivos cerrados—, sin nombre, correo, LinkedIn, teléfono, ids nativos
      #     de proveedor ni valores crudos de env;
      #   * y la regresión de la QA real es IMPOSIBLE de reproducir: corridas = 0
      #     con llamada a Apollo = 1 falla el check.
      - name: Run A2A waterfall no-silent-downgrade tests
        run: npm run test:agent2a:waterfall-no-silent-downgrade

      # ── AGENT2A-LEGACY-CROSS-PROVIDER-LUSHA-CONTINUATION-1 ─────────────────
      #
      # Check OBLIGATORIO. Cubre la continuación de un candidato NACIDO EN APOLLO
      # cuyo reveal ya terminó `no_phone_found`: antes se quedaba sin ninguna vía,
      # y ahora puede continuar hacia Lusha comprando la identidad que falta.
      #
      # Lo que el check impide que se rompa en silencio:
      #
      #   * el costo HISTÓRICO de Apollo no entra en esta autorización. El tope es
      #     5 (identidad ya conocida) o 6 (búsqueda hasta 1 + teléfono hasta 5), y
      #     nunca 13, 14 ni «8 + …»: sumar los 8 le cobraría al operador dos veces
      #     el mismo intento en la confirmación que lee antes de hacer clic;
      #   * el 5 → 6 NUNCA es silencioso. El techo que la persona aceptó se compara
      #     ANTES del preflight y de `reserve_and_create_phone_reveal_run`, así que
      #     una vista previa obsoleta produce 0 reservas y una pregunta nueva;
      #   * Apollo NO se llama: la ruta no expone ninguna dep con la que hacerlo, y
      #     el check falla si aparece una;
      #   * UNA sola Contact Search por autorización, la identidad se PERSISTE antes
      #     de revelar, y una autorización posterior ya no vuelve a comprarla;
      #   * sin credencial no hay claim ni petición, y un timeout después de emitir
      #     conserva la verdad de que salió — sin reintento automático;
      #   * el disparo manual `legacy_lusha_only` (tope 5) sigue SIN poder comprar
      #     la búsqueda, y con el flag del waterfall apagado nada de esto se lee.
      - name: Run A2A legacy cross-provider Lusha continuation tests
        run: npm run test:agent2a:legacy-cross-provider-lusha

      # ── AGENT2A-LEGACY-LUSHA-START-REJECTION-DIAGNOSTIC-1 ──────────────────
      #
      # Check OBLIGATORIO. Cierra el defecto que hizo INDIAGNOSTICABLE un rechazo
      # real de Producción: un candidato que la vista previa declaró elegible con
      # tope 6 fue rechazado al hacer clic, y el operador leyó una sola frase
      # —«este candidato ya no puede autorizarse por esta vía»— mientras la base
      # de datos quedaba intacta (0 corridas, 0 reservas, 0 identidades, 0 usage
      # logs). Esa frase es una afirmación sobre el CANDIDATO, y detrás se
      # colapsaban motivos incompatibles entre sí.
      #
      # Lo que el check impide que se rompa en silencio:
      #
      #   * PARIDAD vista previa ↔ ARRANQUE sobre el BORDE DE I/O REAL: las dos
      #     proyecciones se comparan campo a campo, así que un select o una opción
      #     que diverjan fallan aquí en vez de producir un botón que promete algo
      #     que el servidor rechaza;
      #   * TAXONOMÍA VERAZ: ningún motivo mecánico conocido puede traducirse a
      #     `not_eligible`. El `switch` es exhaustivo y un motivo nuevo rompe la
      #     compilación en vez de heredar la frase genérica;
      #   * una LECTURA QUE FALLA se reporta como INFRAESTRUCTURA, nunca como
      #     inelegibilidad del candidato — ése era el caso en el que la frase era
      #     literalmente falsa;
      #   * PRIVACIDAD fail-closed y ANTES de reservar también en la ruta legacy
      #     AUTOMÁTICA: supresión, do-not-contact y verificación no disponible
      #     bloquean con 0 corridas, 0 reservas y 0 proveedores, y la verificación
      #     NO DISPONIBLE no se confunde con una supresión confirmada;
      #   * los topes siguen siendo 5 y 6 —nunca 8, 13 ni 14—, el techo humano
      #     sigue siendo un LÍMITE SUPERIOR DURO y sin techo aceptado se asume el
      #     suelo conservador de 5;
      #   * el evento de observabilidad es PII-FREE: se comprueba contra los
      #     valores REALES del fixture que no filtra nombre, LinkedIn, empresa,
      #     dominio, id de candidato ni id nativo de proveedor.
      - name: Run A2A legacy Lusha start-rejection diagnostic tests
        run: npm run test:agent2a:legacy-start-rejection-diagnostic

      # ── AGENT1-CUT3B1-FISCAL-IDENTITY-TRUTH ────────────────────────────────
      #
      # Check OBLIGATORIO. Cierra las tres formas en que la identidad fiscal de
      # Agente 1 podía mentir entre la capa gratuita y la de pago:
      #
      #   * el chequeo de novedad gratuito leía SÓLO `prospect_candidates.tax_id`,
      #     mientras las rutas de PAGO escriben habitualmente sólo
      #     `tax_identifier` ⇒ una fila de pago era invisible y el mismo NIT se
      #     volvía a persistir;
      #   * comparaba una aguja YA normalizada contra el valor CRUDO de la
      #     columna, así que la igualdad dependía de la puntuación de la fuente;
      #   * la igualdad podía cruzar países, porque el filtro de país era
      #     opcional: un identificador desnudo NO es único globalmente.
      #
      # También fija lo que este corte NO hace, que es la mitad del contrato:
      #   * dos columnas fiscales que canonicalizan distinto fallan CERRADO —
      #     no se elige una arbitrariamente ni se suprime al candidato;
      #   * el NOMBRE no gana poder de supresión (CUT-3A probó que la comparación
      #     de nombre entre capas está rota; convertirla en supresor duro antes de
      #     tener identidad escalonada produciría fusiones FALSAS);
      #   * el dominio, la identidad de proveedor y el registro entre capas
      #     siguen fuera: no hay tabla nueva, ni alias, ni ON CONFLICT, ni índice
      #     único, ni backfill.
      #
      # La guarda estática compara el CUERPO EJECUTABLE (sin comentarios ni
      # literales) y se prueba a sí misma en NEGATIVO, para que no pueda pasar
      # por vacía.
      #
      # Offline y determinista: sin Supabase, sin red, sin credenciales,
      # 0 créditos, 0 migraciones, 0 proveedores.
      - name: Run Agent 1 CUT-3B1 fiscal identity truth tests
        run: npm run test:a1-cut3b1-fiscal-identity

      # AGENT1-CUT3B23-IDENTITY-COVERAGE-AND-BATCH-REGISTRY — CUT-3B2 + CUT-3B3.
      #
      # Fija el contrato que faltaba entre las TRES rutas de escritura de Agente 1.
      # Antes de este corte cada una decidía la identidad de una empresa con un
      # criterio propio: la gratuita por identidad FISCAL, la de pago por
      # DOMINIO/identidad de proveedor, y el nombre con tres normalizadores
      # distintos — de modo que la misma empresa legal podía persistirse dos veces
      # en un mismo lote sin que nada fallara.
      #
      # Lo que la suite defiende:
      #   * los TRES escritores producen la MISMA evidencia (constructor único);
      #   * el conflicto FISCAL manda sobre dominio, proveedor, LinkedIn y nombre —
      #     dos personas jurídicas distintas que comparten marca o dominio NO se
      #     fusionan;
      #   * un id de Apollo y un id de Lusha con el MISMO valor no pueden
      #     compararse iguales: el namespace del proveedor va dentro de la clave;
      #   * el NOMBRE nunca suprime (sólo anota posible duplicado);
      #   * `discarded` no bloquea: un descarte previo no puede tapar al legítimo;
      #   * el registro es de LOTE — no es novedad global ni histórica;
      #   * descubrimiento crudo ≠ aceptado ÚNICO: un duplicado no consume el
      #     objetivo y NO se cuenta como error.
      #
      # Y fija lo que este corte NO hace, que es la otra mitad del contrato:
      #   * sin migración PROPIA de este corte (CUT-3B23 no añade ninguna). La 125 existe
      #     en el repo — la AUTORA BR-SOURCE FUNCTIONAL CUT-A, más abajo — y está AUTORADA
      #     y NO APLICADA; nada de CUT-3B23 la necesita ni la toca;
      #   * sin ON CONFLICT, sin upsert, sin índice único, sin backfill;
      #   * la siembra sólo LEE;
      #   * `identity_key` no se redefine ni se sobrecarga;
      #   * los huecos parciales de Apollo y Lusha siguen en `false`;
      #   * ningún flag de activación de proveedor se nombra ni se cambia;
      #   * la ATOMICIDAD sigue sin resolver y así queda declarado.
      #
      # La guarda estática compara el CUERPO EJECUTABLE (sin comentarios ni
      # literales) y se prueba a sí misma en NEGATIVO, para que no pueda pasar por
      # vacía. Incluye las suites de CUT-3B1 como ancla de regresión.
      #
      # Offline y determinista: sin Supabase, sin red, sin credenciales,
      # 0 créditos, 0 migraciones, 0 proveedores.
      - name: Run Agent 1 CUT-3B23 batch identity registry tests
        run: npm run test:a1-cut3b23-identity-registry

      # BR-SOURCE-FUNCTIONAL-CUT-A — la PRIMERA construcción funcional tras 8/8 gates y GO.
      #
      # El GO es ESTRECHO: habilita PROPONER código, no ejecutarlo. Esta suite congela el
      # modelo de datos que Brasil necesitaba y, sobre todo, el límite que no cruza:
      #
      #   · `source_period` es FÍSICO, OBLIGATORIO y canónico `YYYY-MM`. Un lote sin periodo
      #     ya no es construible: el builder lo rechaza y la guarda lo rechaza. Una única
      #     definición del periodo — el regex del código y el del CHECK son el MISMO.
      #   · la identidad es UNA sola representación: el CNPJ del establecimiento normalizado,
      #     14 CARACTERES (no 14 dígitos: el CNPJ alfanumérico es oficial desde julio de 2026
      #     y el primer periodo objetivo ES 2026-07). Ejerce la excepción ENUMERADA de 4A;
      #     `tax_id` y `record_identity_key` siguen REFUSED — una excepción para una
      #     representación no es una excepción para tres.
      #   · el peligro YH-2 queda CERRADO, no reubicado: un índice único PARCIAL sobre
      #     columnas NULLABLE no restringe nada, así que el CHECK hace ambas NOT NULL para
      #     Brasil ANTES de que el índice signifique algo.
      #   · las demás fuentes NO se debilitan: la constraint de la 065 se reemplaza por un
      #     índice parcial con las MISMAS cuatro columnas y la MISMA semántica.
      #   · las filas pertenecen a una CORRIDA, no a un periodo: `snapshot_run_id` entra DENTRO
      #     de la clave física, así que la corrida A (publicada) y la B (`preparing`) del MISMO
      #     periodo coexisten. B no puede tocar las filas de A, el lector ve el 100% de A mientras
      #     B carga, y el relevo es UNA transacción que DEGRADA A antes de PROMOVER B — en ese
      #     orden, porque el índice de «una publicada por periodo» es inmediato. Si B falla, A
      #     queda intacta porque su degradación vivía en la transacción que no ocurrió.
      #     `snapshot_run_id` es identificador de PUBLICACIÓN: nunca se deriva del CNPJ y NO es una
      #     segunda representación — la única persistida sigue siendo `normalized_tax_id`.
      #   · la limpieza se acota a una CORRIDA. El reset por PERIODO desapareció: borraba el mes
      #     publicado para reconstruirlo. Ninguna operación destructiva es expresable sin nombrar
      #     una corrida, y ninguna puede apuntar a una `published`.
      #   · leer Brasil por `source_period` A SECAS queda CLASIFICADO INVÁLIDO: ese predicado
      #     devuelve la unión de la corrida publicada con las de staging, y cada fila de esa unión
      #     es individualmente correcta, así que nada falla. El contrato son DOS pasos — resolver
      #     la única corrida `published` y luego filtrar por su id.
      #   · publicar es ATÓMICO por contrato: `publish_period` es SIEMPRE la última operación
      #     del plan, una corrida `preparing` no es legible, y un build fallido no puede
      #     publicarse ni desplazar a la corrida anterior.
      #   · el planificador es un FLUJO: memoria propia O(BATCH_SIZE), no O(FILAS_NACIONALES).
      #     Crear el plan consume CERO filas; no hay Map de periodo, ni array de aceptados, ni
      #     array de operaciones con todas las filas. El colapso de duplicados es EXACTO dentro
      #     del lote y se delega a la BD entre lotes — no hay métrica global, porque una métrica
      #     global exigiría justo la memoria que este corte elimina.
      #
      # 🔴 LO QUE NO HACE: la migración 125 está AUTORADA y NO APLICADA. Ninguna prueba ni
      # script la aplica. Brasil sigue AUSENTE de SOURCE_FAMILY_BY_SOURCE_KEY (el registro
      # sigue lanzando), porque los 5 primitivos de lectura son year-scoped y Brasil mete 12
      # periodos en un año — el primitivo period-aware es de CUT B. Sin puente al motor, sin
      # Agent 1, sin runtime, sin flag.
      #
      # 100% sintético. Sin red, sin Supabase, sin proveedor, sin datos reales de Receita.
      # 0 créditos, 0 escrituras, 0 migraciones aplicadas, 0 flags.
      - name: Run BR-SOURCE FUNCTIONAL CUT-A monthly snapshot foundation tests
        run: npm run test:br-source:functional-cut-a-monthly-snapshot

      # BR-SOURCE CUT A.1 — reconciliación de esquema de Producción antes de CUT B.
      #
      # El intento de aplicar la migración 125 original de CUT-A descubrió, en su preflight,
      # que Producción YA tenía un corte fuera de banda sobre `source_company_snapshots`: la
      # unicidad genérica no-BR vive en `record_identity_key` (UNIQUE canónica + CHECK NOT NULL
      # de toda la tabla), no en `normalized_tax_id`, y ese corte nunca se declaró como
      # migración en este repositorio. Este hito repara la cadena SIN escribir en Producción:
      #
      #   · renombra la migración BR de CUT-A de 125 a 127 (con una escala en 126) — su cuerpo
      #     SQL no cambia en nada que afecte a Brasil — para dejar sitio a una migración 125
      #     GENÉRICA nueva y a la migración 126 de AGENT1-CUT3B4 (independiente, ver abajo),
      #     que reclamó el número 126 mientras esta reconciliación seguía en revisión;
      #   · la nueva 125 reconcilia el modelo de `record_identity_key` para fuentes NO
      #     brasileñas, detectando en runtime si el esquema YA tiene el corte de Producción
      #     (no-op) o si todavía tiene la UNIQUE vieja de la 065 (cutover real, fail-closed
      #     ante datos sucios, sin backfill jamás);
      #   · Brasil queda exenta de la regla genérica: su identidad sigue siendo
      #     `normalized_tax_id`, y `record_identity_key` sigue NULL para ella.
      #
      # La suite estática fija la forma del archivo (identidad de la cadena, sin duplicados de
      # número, migración 087 histórica, contrato de lectura intacto). La suite de PostgreSQL —
      # el paso de abajo — prueba el COMPORTAMIENTO: dos esquemas de partida reales
      # (replay de la cadena del repo, y una base sintética con la forma de Producción),
      # ninguno de los dos pierde ni muta una fila, y el fail-closed rechaza de verdad datos
      # sucios en vez de inventarlos. También prueba que Brasil (127) es estructuralmente
      # independiente de AGENT1-CUT3B4 (126): ninguna migración depende de la otra.
      #
      # NO_PROD_WRITES = 0. MIGRATION_125_APPLIED = NO. MIGRATION_127_APPLIED = NO.
      - name: Run BR-SOURCE CUT A.1 prod schema reconciliation tests (static)
        run: npm run test:br-source:prod-schema-reconciliation

      # `embedded-postgres` ya está instalado por el paso de Agente 1 de más arriba, con la
      # versión PINCHADA 17.6.0-beta.15. `SELLUP_REQUIRE_POSTGRES_HARNESS` convierte el skip en
      # FALLO: sin ella, que el arnés no resolviera pondría este paso verde con una migración
      # inaplicable. Sin `continue-on-error` y sin `|| true`.
      - name: Run BR-SOURCE CUT A.1 prod schema reconciliation tests against real PostgreSQL
        run: npm run test:br-source:prod-schema-reconciliation:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'

      # ── AGENT1-CUT3B4-BATCH-IDENTITY-ATOMICITY ──────────────────────────
      #
      # EL ÚLTIMO BLOQUEADOR ESTRUCTURAL DE CUT-3 ERA LA CONCURRENCIA.
      #
      # CUT-3B2/B3 dejó UNA autoridad de identidad de lote en TypeScript, con sus seis
      # niveles, y declaró por escrito lo que NO resolvía:
      #
      #     Proceso A: siembra el registro del lote en el estado S -> candidato A UNICO
      #     Proceso B: siembra el registro del MISMO lote en S     -> candidato B UNICO
      #     A inserta. B inserta.
      #
      # Las dos decisiones eran válidas contra S; la de B ya estaba CADUCA al
      # comprometerse, y nada en base de datos lo impedía.
      #
      # Lo que esta suite defiende, dicho como defecto:
      #   * que una decisión de admisión CADUCA vuelva a poder escribir — el vallado
      #     compara la época declarada contra la del lote y, si no coincide, NO escribe
      #     nada y NO avanza nada;
      #   * que perder la carrera se cuente como avería: `stale` es control de
      #     concurrencia normal, se re-siembra y se RE-EVALÚA con la MISMA autoridad de
      #     B23 — no hay un segundo evaluador de duplicados;
      #   * que la re-evaluación convierta en duplicado a dos personas jurídicas con
      #     identidad fiscal contradictoria: TIER 0 sigue mandando;
      #   * que agotar el tope de reintentos caiga a un insert SIN valla — falla CERRADO;
      #   * que la serialización convierta a todo segundo candidato concurrente en
      #     duplicado, o que la actividad de un lote caduque a otro;
      #   * que la telemetría de concurrencia lleve un NIT, un dominio, un LinkedIn, un
      #     id de proveedor o un nombre de empresa: sólo conteos y estados;
      #   * que un escritor de B23 conserve un desvío directo una vez la valla existe.
      #
      # La guarda estática compara el CUERPO EJECUTABLE y se prueba a sí misma en
      # NEGATIVO. Incluye las suites de B23 como ancla de regresión.
      #
      # La migración 126 NO se aplica aquí ni en Producción: este paso prueba el
      # contrato del lado del cliente, no lo enciende.
      #
      # Offline y determinista: sin Supabase, sin red, sin credenciales, 0 créditos,
      # 0 proveedores.
      - name: Run Agent 1 CUT-3B4 batch identity atomicity tests
        run: npm run test:a1-cut3b4-batch-identity-atomicity

      # ── AGENT1-CUT3B4 · LA MITAD QUE NINGUNA SUITE DE TypeScript PUEDE CUBRIR ──
      #
      # La afirmación central de CUT-3B4 es de CONCURRENCIA, y no vive en TypeScript:
      # vive en un `SELECT ... FOR UPDATE` sobre la fila del lote, en el orden exacto
      # entre la comparación de época, el INSERT y el avance, y en que PostgreSQL —bajo
      # READ COMMITTED— re-lea la fila YA actualizada al liberarse el cerrojo. Un doble
      # en memoria puede devolver `stale` porque se lo pedimos; eso no prueba NADA sobre
      # la base. Aquí compiten DOS SESIONES DE VERDAD, cada una con su transacción.
      #
      # Lo que sólo una base real responde:
      #   * que la 126 APLIQUE — una función `plpgsql` con dolar-quoting anidado y dos
      #     `COMMENT ON` multilínea son justo la superficie donde un lexer de comillas
      #     pasa y PostgreSQL falla con 42601;
      #   * que la rama `stale` no escriba NI UNA fila y no mueva la época;
      #   * que un INSERT fallido revierta TAMBIÉN el avance de la época — el estado
      #     «época movida, fila ausente» es el que el contrato prohíbe;
      #   * que un bloque de 5 filas avance la época UNA vez, no cinco;
      #   * que `batch_id` se FUERCE al lote vallado: el vallado de un lote no puede
      #     usarse para escribir en otro;
      #   * que la lista de DEFAULTS que la función pre-rellena cubra EXACTAMENTE las
      #     columnas NOT NULL con DEFAULT del catálogo — el ratchet que impide que una
      #     migración futura añada una y la ruta vallada la pierda en silencio;
      #   * que `anon` no pueda ejecutar ninguna de las dos funciones.
      #
      # `embedded-postgres` ya está instalado por el paso de más arriba, con la versión
      # PINCHADA 17.6.0-beta.15. `SELLUP_REQUIRE_POSTGRES_HARNESS` convierte el skip en
      # FALLO: sin ella, que el arnés no resolviera pondría este paso verde con una
      # migración inaplicable. Sin `continue-on-error` y sin `|| true`.
      #
      # La migración NO se aplica en Producción: este paso prueba la valla, no la
      # enciende. 0 proveedores, 0 créditos, 0 escrituras remotas. Datos sintéticos.
      - name: Run A1 CUT-3B4 atomicity tests against real PostgreSQL
        run: npm run test:a1-cut3b4-atomicity:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'

      # ─────────────────────────────────────────────────────────────────────────
      # AGENT1-CUT-3B5 — la 126 bajo RLS y un llamador `authenticated` REAL.
      #
      # La 126 se fusionó y NUNCA se aplicó: el preflight de Producción la bloqueó.
      # Las dos funciones son SECURITY INVOKER y por tanto corren bajo las políticas
      # RLS del llamador; esas políticas invocan `has_active_access(auth.uid())`, que
      # en Producción no fija `search_path` y nombra `internal_users` SIN CUALIFICAR.
      # Con el `search_path` restringido con el que la 126 se publicó, PostgreSQL
      # respondía 42P01 y la ruta de Lusha —que escribe como `authenticated`— habría
      # dejado de persistir candidatos.
      #
      # El paso de B4 de arriba NO podía verlo: corre entero como superusuario, que no
      # pasa por RLS. Este paso adopta el rol `authenticated` de verdad, sin BYPASSRLS.
      #
      # Incluye la prueba en NEGATIVO: reinstala la 126 con el `search_path`
      # defectuoso y exige 42P01, y luego la restaura y exige verde. Sin esa mitad,
      # «esta prueba habría atrapado el defecto» sería una intención, no una medición.
      #
      # La migración NO se aplica en Producción. 0 proveedores, 0 créditos, 0
      # escrituras remotas. Datos sintéticos.
      - name: Run A1 CUT-3B5 M126 RLS/search_path regression against real PostgreSQL
        run: npm run test:a1-cut3b5-m126-rls:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'

      # Trinquetes estáticos de la corrección: que sigue siendo SECURITY INVOKER, que
      # `pg_catalog` precede a `public`, que el NOTIFY de PostgREST está y va al final,
      # y que la corrección no coló índices, disparadores, política TIER ni una M127.
      - name: Run A1 CUT-3B5 M126 correction static guards
        run: npm run test:a1-cut3b5-m126-correction

      # ─────────────────────────────────────────────────────────────────────────
      # APOLLO-CREDIT-QUOTA-SYNC — el sync de créditos de Apollo contra el
      # contrato real del proveedor.
      #
      # El sync llevaba meses fallando con 404 porque apuntaba a
      # `usage_stats/api_usage_stats` (endpoint inexistente para la cuenta) y
      # concluía que "Apollo no expone cuota por API". Sí la expone: el saldo sale
      # de POST `usage_stats/credit_usage_stats` y de
      # `users/api_profile?include_credit_usage=true`.
      #
      # El test anterior no podía atraparlo: replicaba los parsers en el propio
      # archivo de test y nunca importaba el módulo que corre en producción, y
      # además no estaba conectado a ningún script de CI. Este paso arregla las dos
      # cosas: importa el módulo real y entra al check obligatorio.
      #
      # Fija el método POST y el query param include_credit_usage, que son la parte
      # del contrato que rompía el sync. 0 llamadas de red, 0 créditos, payloads
      # reales capturados con ids y correo reemplazados por placeholders.
      - name: Run Apollo credit quota sync contract tests
        run: npm run test:apollo-credit-quota-sync

      # Guarda de eliminación real de reglas de presupuesto.
      #
      # El botón de borrar una regla nunca borraba: la server action hacía
      # UPDATE is_active=false, y los dos consumidores de UI descartaban el
      # ActionResult, así que un fallo (sin permisos, error de BD) recargaba la
      # página como si hubiera borrado.
      #
      # La guarda lee el código fuente real de rule-actions.ts y de los dos
      # consumidores — no replica la lógica, que es lo que dejó vivir el 404 de
      # Apollo. Probada en negativo: inyectar el soft-delete o descartar el
      # resultado la pone roja.
      - name: Run budget rule deletion guard
        run: npm run test:budget-rule-delete

      # ─────────────────────────────────────────────────────────────────────────
      # BR-SOURCE FUNCTIONAL CUT B — el runtime que consume la 127.
      #
      # CUT A dejó el modelo de datos y la SEMÁNTICA escritos, y dijo por escrito lo
      # que NO hacía: sin ejecutor, sin lector, sin registro en runtime, sin Agente 1.
      # Este corte cierra ese hueco y sólo ese hueco:
      #
      #   · el EJECUTOR es un bucle tonto sobre el plan de CUT A. Ningún invariante
      #     vive en él: el orden, el alcance por corrida, la política de duplicados y
      #     la negativa a publicar un periodo parcial siguen siendo propiedades del
      #     PLAN. Sostiene COMO MÁXIMO UN lote a la vez — una mirilla de una posición
      #     que existe sólo porque `publish_period` tiene que commitear CON el último
      #     lote, y un ejecutor en streaming no sabe cuál es el último hasta que llega
      #     la publicación. Recolectar las operaciones primero habría restaurado, en
      #     silencio, justo la memoria O(FILAS_NACIONALES) que CUT A eliminó.
      #   · el GATEWAY habla SQL y no PostgREST, porque PostgREST no tiene
      #     transacciones multi-sentencia y por tanto no podría honrar
      #     `mustCommitWithFinalBatch`: sólo podría fingirlo. La única forma de
      #     publicar es `commitFinalBatchAndPublish(loteFinal, publish)` — no existe un
      #     `publishPeriod` suelto, así que la atomicidad es una propiedad de la FORMA
      #     de la API, no una regla que alguien deba recordar.
      #   · el LECTOR es de DOS PASOS: resuelve la única corrida `published` del
      #     periodo y sólo entonces filtra por su `snapshot_run_id`. No hay
      #     `latest imported_at`, ni `MAX(source_period)`, ni fallback a otro mes. Un
      #     periodo sin publicación se RESPONDE (`NO_PUBLISHED_RUN`); no se repara
      #     ensanchando la consulta.
      #   · Brasil queda REGISTRADA en las registries reales del catálogo, con el
      #     periodo SIEMPRE explícito: la entrada de la registry va SIN mes ligado y
      #     responde `skipped / br_snapshot_period_not_configured` hasta que un
      #     llamador ate uno. Registrar la fuente la hace alcanzable; no decide contra
      #     qué publicación mensual se enriquece.
      #   · Brasil sigue AUSENTE de `SOURCE_FAMILY_BY_SOURCE_KEY`, y eso es lo que
      #     impide usar los cinco primitivos year-scoped contra una fuente que mete
      #     doce periodos en un año.
      #
      # 🔴 EL HALLAZGO DE PRIVACIDAD DE ESTE CORTE: el mensaje y el `detail` de un
      # 23505 de PostgreSQL CITAN LA CLAVE EN CONFLICTO — que para una fila de Brasil
      # CONTIENE EL CNPJ. Ningún error del driver sale nunca hacia el llamador, el
      # resultado ni un log: se conserva el SQLSTATE de cinco caracteres y nada más, y
      # el fallo es un VALOR DE RETORNO en vez de una excepción, precisamente para que
      # no acabe en un `catch (err) { log(err) }`. La suite lo prueba con el error real.
      - name: Run BR-SOURCE FUNCTIONAL CUT-B runtime tests
        run: npm run test:br-source:functional-cut-b-runtime

      # La mitad CONDUCTUAL, contra un PostgreSQL efímero real con la cadena verbatim
      # 065 → 087 → 125 → 127. Lo que aquí se mide no lo puede arbitrar ningún doble:
      # que la corrida `preparing` y la `published` del mismo periodo coexistan
      # físicamente; que un lector en OTRA CONEXIÓN vea la corrida A hasta el COMMIT y
      # la B después, jamás una mezcla; que promover antes de degradar lo rechace el
      # índice inmediato; que el replay de la misma corrida sea idempotente; que un
      # upsert SIN el predicado del índice parcial falle con 42P10 en vez de duplicar;
      # que la FK `ON DELETE RESTRICT` impida borrar una corrida con filas vivas; y que
      # un rebuild fallido no toque el mes publicado.
      #
      # `embedded-postgres` ya está instalado por los pasos de más arriba, con la
      # versión PINCHADA 17.6.0-beta.15. `SELLUP_REQUIRE_POSTGRES_HARNESS` convierte el
      # skip en FALLO. Sin `continue-on-error` y sin `|| true`.
      #
      # 0 migraciones aplicadas, 0 escrituras remotas, 0 proveedores, 0 créditos,
      # 0 flags. Todo dato es sintético.
      - name: Run BR-SOURCE FUNCTIONAL CUT-B runtime tests against real PostgreSQL
        run: npm run test:br-source:functional-cut-b:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'

      # ── AGENT1-CUT4-A1 — BATCH COUNT TRUTHFULNESS + SAFE REVIEW NAVIGATION ──────
      #
      # Lo que estas dos suites impiden que vuelva: la capa de lotes contaba sus
      # candidatos filtrando por `isUsefulReviewCandidate`, un clasificador de
      # CALIDAD DE UI que devuelve `false` para un candidato colombiano sin
      # `tax_identifier` que no venga de `external_import`. Apollo, Lusha y web_ai
      # persisten esas filas legítimamente, así que en Producción (Gate 0) 100
      # candidatos durables repartidos en 24 lotes —aprobables desde Prospectos— se
      # contaban como CERO en la ficha del lote, que es la pantalla donde aterriza
      # el operador justo después de una corrida de PAGO.
      #
      # La invariante que fijan: EXISTENCIA DURABLE != CLASIFICACIÓN DE CALIDAD.
      # Contar responde «¿está persistida y no borrada?», y esa pregunta ya tiene
      # una autoridad —el contrato durable de CUT-1—, que es la que se reutiliza.
      # Hay una guarda ESTÁTICA que falla si `batch-candidate-counts.ts` vuelve a
      # importar o mencionar `isUsefulReviewCandidate`: si reentra, reentra la
      # mentira.
      #
      # Lo que estas suites NO afirman, y por eso siguen siendo verdad:
      #   · `isUsefulReviewCandidate` conserva su semántica intacta — un candidato
      #     contado puede seguir clasificado como no útil, y eso es correcto;
      #   · `usefulCount` de la generación y la aritmética de objetivo no cambian;
      #   · la tabla accionable de la ficha sigue recibiendo EXACTAMENTE el mismo
      #     subconjunto filtrado, porque `CandidateRowActions` conserva fuera de
      #     Prospectos el comportamiento heredado de aprobar/descartar/duplicar y
      #     ampliar esa superficie es CUT4-C, no este corte. El estado intermedio
      #     seguro es contar la verdad, no ampliar acciones y ENLAZAR a la cola
      #     oficial ya existente: `/accounts?tab=prospectos&sourceId=<batchId>`.
      #
      # Puras: sin I/O, sin Supabase, sin React, sin env, sin reloj, sin red.
      # 0 migraciones, 0 escrituras remotas, 0 proveedores, 0 créditos, 0 flags.
      # Sin `continue-on-error` y sin `|| true`.
      - name: Run Agent 1 CUT4-A1 batch count truthfulness tests
        run: npm run test:a1-cut4-batch-count-truthfulness

      # ── AGENT1-CUT4-B1 — paridad de procedencia en los writers restantes ─────
      #
      # El defecto que cierran: `structured-source-candidate-writer.ts` y la ruta
      # `create-import-batch` insertaban `status='needs_review'` dejando
      # `record_origin` en NULL por OMISIÓN del writer. La cola de revisión limpia
      # exige `PENDING_REVIEW_RECORD_ORIGIN` y con ella los cuatro gates de acción,
      # así que el candidato quedaba VISIBLE y no OPERABLE.
      #
      # Lo que fijan estas suites:
      #   · los DOS writers delegan en el clasificador canónico
      #     (`resolveCandidateRecordOriginForWriter`) y sólo PROYECTAN su decisión;
      #     ninguno define vocabulario de procedencia propio ni escribe el literal
      #     `record_origin: 'production'`;
      #   · corrida limpia ⇒ `production`; smoke de UI ⇒ `smoke_test`; QA ⇒ `qa`;
      #     modo seco ⇒ NO inserta; `previewMode` por sí solo NO degrada la
      #     procedencia (es POLÍTICA de revisión, no marca de no-producción);
      #   · una importación externa termina SIEMPRE en `import`, nunca en
      #     `production`, y sigue sin ser accionable en la cola limpia — este corte
      #     es paridad de procedencia, no ensanchamiento de permisos;
      #   · `source_primary`, `status`, `duplicate_status` y los gates de revisión
      #     no cambian; la metadata es ADITIVA y hay UNA sola puerta de inserción
      #     por candidato; el vallado de CUT-3 se conserva.
      #
      # Puras: sin I/O, sin Supabase, sin red, sin env, sin reloj.
      # 0 migraciones, 0 escrituras remotas, 0 proveedores, 0 créditos, 0 flags.
      # Sin `continue-on-error` y sin `|| true`.
      - name: Run Agent 1 CUT4-B1 writer provenance parity tests
        run: npm run test:a1-cut4-b1-writer-provenance

      # ── AGENT2-FINAL-INTEGRATION — la cadena de sincronización con HubSpot ─────
      #
      # EL DEFECTO QUE CIERRA LA CADENA COMPLETA: la ficha de un contacto decía
      # `Sincronizado` cuando HubSpot ya no lo estaba. No por un error de lógica —no
      # había ninguna sentencia en el esquema capaz de cambiar ese estado— así que
      # cada camino que toca el teléfono oficial lo dejaba mintiendo:
      #
      #   · CUT-1  el estado durable de sincronización nace (`hubspot_sync`);
      #   · CUT-2  el envío de un teléfono ya vinculado deja de ser invisible;
      #   · CUT-3A la COMPLETITUD: el MERGE de un duplicado (117) y el borrado del
      #            saliente ya se pueden representar. `phone_removed` entra al
      #            vocabulario, y con él la operación que lo ejecuta;
      #   · CUT-3B la aprobación de un candidato oficial sincroniza sola;
      #   · CUT-3C la PROCEDENCIA durable (`stale_source`): un `stale` nacido de una
      #            erasure de privacidad y uno nacido de una edición manual eran
      #            IDÉNTICOS, así que una bandera genérica habría exportado la
      #            erasure. `privacy` es inexportable POR CONSTRUCCIÓN;
      #   · FINAL  la 128 re-emitida (131) marca `stale`/`reveal` DENTRO de su propia
      #            transacción: un rollback se lleva el número y el veredicto juntos,
      #            que es lo que elimina la ventana en la que el teléfono ya está
      #            guardado y la ficha todavía dice `synced`;
      #   · BACKFILL un contacto vinculado ANTES de que el estado existiera era
      #            INVISIBLE para la detección de pendientes y la UI lo pintaba verde.
      #            La 132 le escribe una línea base `synced` + `baseline_source`.
      #
      # AGENT2-FINAL-INTEGRATION-PREPARATION-LOCAL-1 canonicalizó las cuatro
      # migraciones —que nacieron SIN número a propósito, mientras la numeración
      # 125/126/127 estaba en disputa aguas arriba— a 129/130/131/132, y con ello
      # entran por primera vez en las guardas de techo del repositorio, que filtran
      # exactamente `^\d{3}_`. Ya no queda NINGÚN fichero de migración fuera del radar.
      #
      # Puras: sin I/O, sin Supabase, sin React, sin env, sin red, sin reloj.
      # 0 escrituras remotas, 0 HubSpot real, 0 proveedores, 0 créditos, 0 flags nuevos.
      # Sin `continue-on-error` y sin `|| true`.
      - name: Run Agent 2 HubSpot sync chain tests (CUT-1 → BACKFILL)
        run: npm run test:agent2a:final-local-integration

      # La 131 es GENERADA: su cuerpo es el de la 128 con los CINCO splices declarados
      # en `scripts/local/build-final-reveal-migration.mjs`. Este paso re-deriva el
      # archivo y compara BYTE A BYTE. Sin él, un cambio en la 128 podría quedarse
      # silenciosamente fuera de la re-emisión, o una edición a mano de la 131 podría
      # introducir una divergencia de comportamiento que ninguna prueba nombra —porque
      # la prueba compararía la copia consigo misma.
      - name: Verify the generated Agent 2 reveal migration is byte-exact
        run: npm run test:agent2:final-reveal-migration-generator

      # UNA MIGRACIÓN QUE PostgreSQL NO PUEDE APLICAR TIENE QUE ROMPER ESTE CHECK.
      #
      # `embedded-postgres` ya está instalado por el paso de Agente 2A de más arriba, con
      # la versión PINCHADA 17.6.0-beta.15. `SELLUP_REQUIRE_POSTGRES_HARNESS` convierte el
      # skip en FALLO: sin ella, que el arnés no resolviera pondría este paso verde con una
      # cadena inaplicable.
      #
      # Lo que estas cuatro suites prueban sobre PostgreSQL REAL, replayando la cadena del
      # repo y aplicando 128 → 129 → 130 → 131 → 132 en ese orden exacto:
      #   · el orden NUMÉRICO del directorio ES el orden de dependencia (la 130 borra la
      #     firma de TRES argumentos que la 129 creó y publica la de CUATRO; aplicadas al
      #     revés, las dos RPC llamarían a una firma inexistente: 42883 en mitad de un
      #     merge o de una erasure);
      #   · la proyección VIVA es la de la 131, no la 128 original;
      #   · idempotencia en segunda pasada: cero filas y cero bytes cambiados;
      #   · reversibilidad: un ROLLBACK se lleva el teléfono Y el `stale`;
      #   · ni `anon` ni `authenticated` tienen EXECUTE sobre ninguna de las funciones;
      #   · no hay extensión de red instalada, así que SQL no pudo llamar a HubSpot.
      #
      # 0 escrituras remotas. MIGRATIONS 129–132: APPLIED IN PRODUCTION = NO.
      # Sin `continue-on-error` y sin `|| true`.
      - name: Run Agent 2 HubSpot sync chain against real PostgreSQL
        run: npm run test:agent2a:final-local-integration:postgres
        env:
          SELLUP_REQUIRE_POSTGRES_HARNESS: '1'
