      - name: Run A1 pre-paid novelty gate tests
        run: npm run test:a1-prepaid-novelty-gate
      # AGENT1-COUNTRY-SOURCE-PERSISTENCE-CONTRACT-1 — tres cosas distintas:
      #
      #   1. vocabulario de lote vs. candidato (prospect_batches.source vs.
