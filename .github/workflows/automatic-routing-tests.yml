      - name: Run mobile phone provenance erasure tests
        run: npm run test:agent2a:mobile-phone-provenance-erasure

      # AGENT2A-PHONE-REVEAL-4O-E4.1-R1 — editar el teléfono a mano invalida la
      # procedencia del proveedor.
      #
      # El defecto que cierra: E4 dejó la supresión de teléfonos oficiales apoyada por
      # completo en `contacts.phone_source`, pero `updateContact` escribía
