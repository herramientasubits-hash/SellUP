name: Automatic Routing Tests

# Safety gate for Agent 2A automatic contact-enrichment routing (5B/5C).
# Runs the critical routing/fallback test suite on every PR and on pushes to
# main so regressions in Apollo -> Lusha fallback behavior are caught in CI.
# No provider credentials, Supabase env vars, or feature flags are used: the
# suite is fully deterministic and makes no external calls.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: automatic-routing-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automatic-routing:
    name: Automatic routing safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGENT2A-PHONE-WATERFALL-4F: Node 24, la versión con la que se desarrolla.
      # Con Node 20, `mock.module()` no resuelve los alias `@/…` de tsconfig, así que
      # TODA suite de UI que mockee un módulo por alias falla con ERR_MODULE_NOT_FOUND
      # — no por un defecto del código, sino del runner. Era invisible mientras ninguna
      # suite jsdom corría en CI; al entrar las del teléfono, dejó de serlo. Los nueve
      # pasos que ya existían se verificaron uno a uno en Node 24 antes de este cambio.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run automatic routing safety tests
        run: npm run test:agent2a:automatic-routing

      # Q3F-5BB.10C3-FIX-1 — Lusha fail-closed routing (STRICT-ALL). Guards the
      # invariant that a Lusha run never touches Apollo/Tavily and that with
      # ENABLE_LUSHA_PREVIEW off no route ever resolves to Lusha.
      - name: Run Lusha fail-closed routing tests
        run: npm run test:lusha-fail-closed-routing

      # AGENT1-SHARED-INTAKE-CI-GUARD-1 — el pipeline de admisión COMPARTIDO y
      # NEUTRAL AL PROVEEDOR entra al check obligatorio.
      #
      # Estas suites no son nuevas: existen desde 10B1/10B2/10C1/10C2 y describen la
      # arquitectura que Lusha SÍ adoptó — contratos por proveedor
      # (ProviderDiscoveredCompany), normalización única
      # (NormalizedProspectCandidate), gate obligatorio, enrichment de fuente oficial
      # neutral al proveedor, estado de duplicado y orden de persistencia. Lo que no
      # existía era su protección: tenían script en package.json pero NINGUNA corría
      # en CI, así que el único check obligatorio del repo — «Automatic routing safety
      # tests» — se ponía verde con el contrato compartido roto. Apollo pudo así
      # construir su propia ruta de admisión sin que un solo check se pusiera rojo, y
      # el diagnóstico correcto no es «no se construyó» sino
      # EXISTING_SHARED_FLOW_NOT_ADOPTED_BY_APOLLO.
      #
      # Los pasos van SEPARADOS a propósito: cuando uno falle, GitHub Actions nombra
      # el contrato exacto que se rompió, no «los tests». Van aquí arriba, junto al
      # resto de contratos de proveedor, para que una rotura de la base falle antes de
      # los ~50 pasos que dependen de ella.
      #
      # Este PR NO cambia runtime: ni Apollo, ni Lusha, ni routing, ni presupuesto,
      # ni flags. Es cableado de CI sobre suites y scripts que ya existían.
      #
      # Deterministas y offline las cinco: sólo `node:test`, fixtures y lectura
      # ESTÁTICA de código fuente. Sin Supabase, sin Socrata/co_siis, sin API de
      # proveedor, sin créditos y sin escrituras. La única variable de entorno que se
      # toca es ENABLE_LUSHA_PREVIEW DENTRO del proceso de test —para ejercitar el
      # parser del flag— y se restaura en `finally`; Producción no se toca.

      # 10B1 — contrato de admisión por proveedor. Guarda que los TRES adaptadores
      # (Lusha, Apollo, Tavily) satisfagan el MISMO contrato normalizado. Incluye el
      # adaptador Apollo ya existente (`mapApolloCompanyToProviderDiscoveredCompany`),
      # que es la pieza sobre la que el siguiente PR hará que Apollo adopte el seam
      # compartido — sin este paso, ese contrato podría desviarse en silencio.
      - name: Run shared provider intake contract tests
        run: npm run test:prospect-intake-contracts

      # 10B2 — gate obligatorio compartido. Guarda que un candidato excluido en
      # duro NUNCA continúe hacia el flujo caro (enrichment) ni hacia la deduplicación.
      - name: Run shared mandatory intake gate tests
        run: npm run test:prospect-intake-gate

      # 10C1 — enrichment de fuente oficial NEUTRAL al proveedor. Guarda que funcione
      # igual contra fixtures de Lusha, Apollo y Tavily, y que el resolvedor se
      # mantenga inyectado, read-only y fail-soft (sin consultar co_siis en vivo).
      - name: Run shared official-source enrichment tests
        run: npm run test:prospect-intake-source-enrichment

      # 10C2 — el pipeline compartido de punta a punta, tal como Lusha lo adoptó:
      # resultado del proveedor → map → normalize → gate obligatorio → enrichment
      # oficial → estado de duplicado → orden de persistencia. Incluye la prueba
      # estática de que el resolvedor de fuente oficial no abre clientes por su cuenta.
      - name: Run shared intake pipeline adoption tests
        run: npm run test:lusha-shared-pipeline

      # Guarda que el flag SERVIDOR detenga a Lusha ANTES de crear el cliente, de
      # buscar y de escribir. Es prueba ESTÁTICA de orden sobre el código: no crea
      # clientes, no llama a Lusha y no cambia el flag en Producción.
      - name: Run Lusha preview flag guard tests
        run: npm run test:lusha-preview-flag-guard

      # AGENT1-PROVIDER-AVAILABILITY-UNIVERSAL-1 — disponibilidad universal del
      # proveedor de discovery de Agente 1. Entra al check obligatorio porque el
      # defecto que cierra era invisible a toda la cobertura anterior: la pantalla
      # final derivaba la disponibilidad del proveedor de la ruta del proveedor
      # OCULTO Lusha, así que «Empresas por criterios» con una industria que mapea a
      # un sector Lusha (salud, educación, tecnología) quedaba sin selector y sin
      # «Generar prospectos» en los 20 países soportados, con Apollo desplegado,
      # configurado y con presupuesto — y los tests de entonces PINABAN ese bloqueo
      # como si fuera correcto. La suite barre los 20 países, los modos aplicables,
      # 0/1/N subindustrias, el desacople default≠disponible, la paridad UI/servidor,
      # la conservación de los candados de gasto y los topes 5/2/10/20/5 ⇒ 25, y la
      # regresión exacta de Salud/Colombia. Determinista: sin flags, sin proveedores,
      # sin créditos y sin DB real.
      - name: Run A1 Apollo universal provider availability tests
        run: npm run test:a1-apollo-universal-provider-availability

      # Q3F-5BB.11B — Pure provider routing plan. Guards the 10C3 invariant at
      # the routing-plan layer: an intended-Lusha plan never routes to Apollo,
      # fail-closed on disabled providers, and unknown cost is never treated as
      # free. Fully deterministic: no env, no provider calls, no DB.
      - name: Run provider routing plan tests
        run: npm run test:provider-routing-plan

      # Q3F-5BB.11C — Additive provider routing metadata contract. Guards that
      # the metadata builders/merges stay pure and additive (existing batch /
      # candidate keys preserved), unknown cost is never persisted as 0, and the
      # candidate source_provider stays consistent with source_trace.sourceProvider.
      - name: Run provider routing metadata tests
        run: npm run test:provider-routing-metadata

      # Q3F-5BB.11D — Lusha ⇄ provider-routing OBSERVATIONAL wiring. Guards that
      # the live Lusha flow stamps additive routing metadata (provider_routing /
      # provider_attempts / provider_trace) without ever selecting Apollo/Tavily,
      # keeps the flag guard authoritative (flag OFF ⇒ no routing plan runs), and
      # never coerces unknown cost to 0. Deterministic: no env, no provider calls,
      # no DB.
      - name: Run Lusha provider routing wiring tests
        run: npm run test:lusha-provider-routing-wiring

      # Q3F-5BB.11E — Apollo ⇄ provider-routing OBSERVATIONAL wiring. Guards that
      # the Agent 1 wizard, when the double gate has already selected Apollo
      # company discovery, stamps additive provider_routing metadata
      # (intended=default_ai, selected=apollo) without adding a fallback, without
      # ever diverting to Lusha (10C3), and without touching phone/contact
      # enrichment; and that Apollo OFF (default_ai → Tavily/null) is not unsafe.
      # Deterministic: no env activation, no provider calls, no DB.
      - name: Run Apollo provider routing wiring tests
        run: npm run test:apollo-provider-routing-wiring

      # Q3F-5BB.11F.1 — Apollo batch provider_attempts[] OBSERVATIONAL metadata.
      # Guards that the candidate-writer emits an additive batch provider_attempts[]
      # entry ONLY for Apollo company discovery (web_search_provider=
      # 'apollo_organizations') AND only when 11E already stamped provider_routing;
      # that Tavily/mock metadata stays byte-for-byte unchanged; that credits are
      # reconciled strictly from provider_usage_logs (apollo/organizations_search),
      # estimated_cost_usd stays null, and unknown counts never become 0; and that
      # the pure helper imports no Supabase/env/fetch/provider/contact-enrichment.
      # Deterministic: no env activation, no provider calls, no real DB.
      - name: Run Apollo provider attempts tests
        run: npm run test:apollo-provider-attempts

      # Q3F-5BB.11F.2 — Apollo per-candidate provider_trace + source_trace.
      # Guards that each inserted candidate row carries an additive
      # metadata.source_provider='apollo', metadata.provider_trace (attempt_index=0,
      # cost null/null) and source_trace.sourceProvider='apollo' ONLY for Apollo
      # company discovery (web_search_provider='apollo_organizations') AND only when
      # 11E already stamped provider_routing; that Tavily/mock candidate rows stay
      # byte-for-byte unchanged (no source_trace/provider_trace/source_provider);
      # that a provider mismatch fails closed (ProviderMetadataConsistencyError);
      # and that the pure helper stays free of Supabase/env/fetch/provider/
      # contact-enrichment/phone-reveal. Deterministic: no env activation, no
      # provider calls, no real DB.
      - name: Run Apollo candidate provider trace tests
        run: npm run test:apollo-candidate-provider-trace

      # A1-LEGACY-PATH-FENCE-1 — P0 fence against implicit legacy Apollo fallback.
      # Guards the six defence layers: canonical parsing of the `sensitive` wizard
      # flags (TRUE/" true"/"true\n" must read as ON, anything else OFF); the typed
      # catalog availability contract (a failed read can no longer collapse into
      # `catalog=null`); that NO availability state resolves to the legacy Apollo
      # experience; that every unavailable UI state renders without a billable CTA
      # and never calls generateAIProspectBatch; that the server-side capability
      # gate (admin + ENABLE_LEGACY_APOLLO_PROSPECT_GENERATION, default OFF) runs
      # BEFORE any batch/agent-run/provider/usage-log write and cannot be unlocked
      # by client-supplied fields; and that ENABLE_APOLLO_COMPANY_SEARCH is enforced
      # authoritatively at runtime immediately before the single
      # searchApolloOrganizations call site. Deterministic: no env activation, no
      # provider calls, no credits, no real DB (Supabase is a loopback stub).
      - name: Run A1 legacy Apollo path fence tests
        run: npm run test:a1-legacy-path-fence

      # A1-APOLLO-TWO-ROUND-QUALITY-1 — modalidad Apollo de dos rondas, de punta a
      # punta. Guarda las invariantes que este hito cierra y que sólo se pueden
      # romper en silencio: que el executor del wizard enrute al orquestador (y con
      # el flag OFF al runner legacy con sus números de siempre); que CADA
      # Organization Enrichment deje UNA fila en provider_usage_logs con la
      # correlación completa, la ronda y el sujeto, y ninguna de más en un reintento;
      # que una operación cuyo cobro no se confirmó quede indeterminada, no se
      # reintente, no ejecute lo que dependa de ella y fuerce billing_unknown; que
      # cada transición recuperable deje un checkpoint durable y que una operación
      # cuyo checkpoint falló NO pueda marcarse como completada; que un reintento
      # recupere rondas, candidatos, enrichments y `candidates_persisted` sin
      # repetir una búsqueda, un enrichment ni una escritura de candidatos; que el
      # checkpoint sea mínimo y sanitizado (sin payloads completos, headers,
      # secretos ni datos personales) y quepa bajo su techo declarado; que su
      # escritura conserve la metadata de otros autores y rechace una versión
      # stale; que la reconciliación sume búsqueda + enrichment de las dos rondas
      # sin duplicar créditos al repetirse; y que el enrichment no repita la
      # verificación de sitio ni la consulta de duplicados. Determinista: sin
      # activación de flags, sin llamadas al proveedor, sin créditos, sin DB real.
      - name: Run A1 Apollo two-round quality tests
        run: npm run test:a1-apollo-two-round-quality

      # A1-APOLLO-PERSISTENCE-REVIEW-FIX-1 — el preflight de persistencia entra al
      # check obligatorio. Sin este paso, la cobertura del guardrail que impide el
      # fallo de LIVE-QA-2 (12 créditos gastados y 0 candidatos guardados porque
      # `prospect_candidates.identity_key` no existía) no corría en ningún PR: el
      # typecheck protege el catálogo de códigos, pero no verifica el ORDEN real del
      # preflight, el cero gasto, la clasificación de los errores de PostgREST, la
      # tabla vacía, la sanitización, el comportamiento post-gasto, la migración
      # estática ni el fixture de QA. Determinista: sin flags, sin proveedores, sin
      # créditos y sin DB real.
      - name: Run A1 Apollo persistence readiness tests
        run: npm run test:a1-apollo-persistence-readiness

      # AGENT1-APOLLO-CANDIDATE-INSERT-FORENSICS-1 — el dominio REAL de
      # `classification_source` entra al check obligatorio. La corrida live
      # `9a9acf99` perdió su único candidato con subindustria confirmada porque el
      # proyector escribía en esa columna el vocabulario de evidencia
      # (`provider_industry`, …) y la CHECK de la migración 093 sólo admite el de
      # quién clasificó (`writer`, `derived_*`, …): dos conjuntos sin un solo valor
      # en común, así que fallaban EXACTAMENTE los candidatos que cuentan hacia el
      # objetivo. La suite compara el código contra el SQL de la migración, así que
      # un vocabulario nuevo no puede volver a colarse. Determinista: sin flags, sin
      # proveedores, sin créditos y sin DB real.
      - name: Run A1 Apollo candidate insert forensics tests
        run: npm run test:a1-apollo-candidate-insert-forensics

      # AGENT1-APOLLO-SCALE-SECOND-ROUND-FIX-1B — la PÁGINA que la ronda 2 pide y el
      # desglose que la UI pinta entran al check obligatorio. Sin este paso ninguna
      # de las dos cosas corría en CI: la corrida live `eae6d47f` pagó cinco créditos
      # por una ronda 2 en la página 1 cuyos términos efectivos se solapaban con la
      # ronda 1 —mismas cinco empresas de vuelta— y la usuaria lo vio como «ya
      # sugeridos recientemente» sin una sola cifra. La suite entra por el runner de
      # producción real con el proveedor doblado y renderiza el panel real.
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run A1 Apollo second-round page and breakdown tests
        run: npm run test:a1-apollo-scale-second-round

      # AGENT1-APOLLO-LINKEDIN-QUALITY-INTEGRATION-1 — el contrato de completitud y
      # el vocabulario de objetivo entran al check obligatorio. Sin este paso NADA
      # de #234 ni de #235 corría en CI: ninguna de sus suites estaba enganchada a
      # un script, así que el typecheck era toda su protección. Lo que aquí se fija
      # es lo que la corrida `be181d2d` no supo responder: cuántas empresas se
      # guardaron para revisión y cuántas, completas y válidas, cuentan de verdad
      # hacia el objetivo. Determinista: sin flags, sin proveedores, sin créditos y
      # sin DB real.
      - name: Run A1 Apollo LinkedIn and quality integration tests
        run: npm run test:a1-apollo-linkedin-quality-integration

      # AGENT1-SUBINDUSTRY-FAIL-CLOSED-TARGET-INTEGRITY-1 — la integridad del
      # objetivo entra al check obligatorio. La corrida live `8c86eb06` contó 3 de 4
      # empresas hacia el objetivo SIN una sola subindustria confirmada, porque el
      # writer decidía con `sectorEvidenceState` —el veredicto de INDUSTRIA— en vez
      # de con el de subindustria, que ya era correcto y ya estaba persistido. Lo
      # que este paso guarda, y que no falla al compilar:
      #
      #   * que las anclas casen por PALABRA o frase completa y nunca por
      #     substring: con `moda` y `fashion` de anclas, «cómodas»,
      #     «acomodación», «Accommodation», «incómoda» y «acomodada» quedaban
      #     confirmadas y contaban;
      #   * que `\b` de JavaScript NO se use como matcher (es ASCII: una tilde le
      #     crea una frontera de palabra falsa), y que los plurales de las listas
      #     que RECHAZAN sigan rechazando tras el cambio de matcher;
      #   * que la precisión evalúe las CINCO subindustrias que el wizard permite
      #     con semántica ANY-OF —la misma de la búsqueda Apollo— y no sólo
      #     `subindustries[0]`;
      #   * que pedir subindustria y no obtener veredicto sea fail-closed, sin
      #     caer NUNCA al veredicto de la industria padre;
      #   * que las búsquedas SIN subindustria conserven su comportamiento;
      #   * que la ficha no pueda mostrar «Subindustria ambigua» sobre una
      #     RECHAZADA, ni «Cuenta hacia el objetivo: Sí» sobre una no confirmada;
      #   * que `classification_source` siga llevando el vocabulario de QUIÉN
      #     clasificó (PR #238) y no el de la evidencia, que es lo que producía el
      #     error 23514 contra la CHECK de la migración 093.
      #
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run A1 subindustry fail-closed target integrity tests
        run: npm run test:a1-subindustry-fail-closed-target-integrity

      # AGENT1-MULTI-SUBINDUSTRY-REQUEST-OBSERVABILITY-1 — la SOLICITUD y la
      # contabilidad del desenlace entran al check obligatorio. #241 dejó el
      # backend multi-subindustria correcto (ANY-OF en consulta, precisión y
      # gates de gasto), pero la corrida live `7d92773b` pidió dos subindustrias
      # y el lote se creó con una: la pérdida estaba ANTES del servidor, en el
      # paso del wizard, y ninguna pantalla la mostraba antes de gastar.
      #
      # Lo que este paso guarda, y que no falla al compilar:
      #
      #   * que la multiselección viaje íntegra y EN ORDEN por la ruta real —
      #     reductor → solicitud → schema estricto → resolutor de catálogo →
      #     production-runner— con 1, 2 y 5 subindustrias, con [A,B] frente a
      #     [B,A], y tras «editar» y volver a la confirmación;
      #   * que los ids duplicados tengan política explícita (se colapsan en la
      #     primera aparición en la UI; en la solicitud INVALIDAN la petición) y
      #     que un id inválido o de más falle cerrado, sin eliminación silenciosa;
      #   * que la selección ya NO viva en un borrador local del paso: el árbol
      #     del paso activo se desmonta cada vez que el hilo de mensajes
      #     "escribe", y con el borrador eso descartaba lo elegido sin aviso. La
      #     suite remonta el paso a propósito;
      #   * que la pantalla previa al gasto liste TODAS las subindustrias con su
      #     contador (antes la recapitulación sólo existía dentro del panel de
      #     Lusha, así que la ruta que de verdad gasta no mostraba ninguna);
      #   * que un rechazo sectorial descubierto DESPUÉS del enrichment se
      #     contabilice exactamente una vez en su ronda (la ronda 2 de `7d92773b`
      #     cerró 9 sobre 10 empresas únicas) y que el desglose reconcilie contra
      #     el total, declarando lo que no cuadra en vez de esconderlo;
      #   * que un rechazo FINAL nunca pueda ser bloqueado por un `eligible`
      #     anterior al fusionar checkpoints («Supermercado Vaquita» quedó
      #     archivada como elegible mientras run_metrics decía 0).
      #
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run A1 multi-subindustry request and reconciliation tests
        run: npm run test:a1-multi-subindustry-request-observability

      # AGENT1-MULTI-SUBINDUSTRY-QUERY-DRAFTING-ANYOF-1 — la COBERTURA de la consulta
      # entra al check obligatorio. #245 demostró que la multiselección llega íntegra
      # al runner y #241 que los gates de gasto la evalúan con ANY-OF, pero la corrida
      # live `ce957e2f` pidió dos subindustrias y las consultas efectivas de las DOS
      # rondas sólo representaron a una: 21 créditos, 20 organizaciones, 0 candidatos.
      # La causa eran dos resolvedores FIRST-ONLY en fila
      # (`primarySubindustryForQueryDrafting` → `resolveFirstApolloSubindustrySearchMapping`),
      # y el segundo invalidaba la justificación escrita del primero.
      #
      # Lo que este paso guarda, y que no falla al compilar:
      #
      #   * que las subindustrias pedidas se repartan round-robin dentro del ÚNICO
      #     array de keyword tags, de modo que con 1, 2 o 5 selecciones todas queden
      #     representadas bajo el tope de cinco posiciones;
      #   * que permutar la solicitud no cambie a quién representa la consulta;
      #   * que las DOS rondas conserven la cobertura, incluida la variante de
      #     página 2;
      #   * que una subindustria sin términos NO se omita en silencio: la búsqueda se
      #     bloquea antes de gastar, con cero créditos, cero llamadas al transporte y
      #     cero filas económicas, y con la causa auditable en metadata;
      #   * que el número de llamadas pagadas, el cap de 5 enrichments y el techo de
      #     25 créditos sean invariantes al número de subindustrias;
      #   * que el allowlist del contrato del proveedor no se amplíe (nada de un
      #     parámetro por subindustria, ni de una llamada por subindustria);
      #   * que los contratos de #245 (solicitud íntegra y en orden), #241 (ANY-OF en
      #     precisión y en los gates de gasto) y #238 (vocabulario de
      #     `classification_source`) sigan en pie.
      #
      # Determinista: sin flags de Producción, sin proveedores, sin créditos y sin DB real.
      - name: Run A1 multi-subindustry query drafting ANY-OF tests
        run: npm run test:a1-multi-subindustry-query-drafting-anyof

      # CATALOG SOURCE-OF-TRUTH FINAL ADDENDUM — la COHERENCIA DE VERSIÓN del catálogo
      # entra al check obligatorio.
      #
      # El catálogo de industrias no es code-owned: vive en PostgreSQL y una versión
      # nueva se publica con una transacción (`publish_industry_catalog_version`), sin
      # despliegue. El wizard lo lee en vivo y verifica la versión que el navegador
      # envió; el addendum anterior, en cambio, redactaba las consultas con un snapshot
      # TypeScript de `subindustry_search_terms`. Dos fuentes de verdad para el mismo
      # catálogo, y la segunda podía describir otra versión sin que nada fallara.
      #
      # Lo que este paso guarda, y que no falla al compilar:
      #
      #   * que ningún módulo de producción vuelva a importar un snapshot de esa tabla,
      #     ni el fixture de la lectura congelada, ni un cliente de Supabase dentro de
      #     la ruta pura de construcción de la consulta;
      #   * que la selección y los términos vengan de la MISMA versión publicada
      #     (`selection_catalog_version == search_term_catalog_version`), y que la
      #     ausencia se trate como incoherencia y no como permiso;
      #   * que una incoherencia bloquee ANTES del gasto: cero llamadas al transporte,
      #     cero créditos, cero filas económicas, y la causa con las DOS versiones en
      #     metadata;
      #   * que un cambio de catálogo v1 → v2 no pueda producir nunca
      #     `wizard=v2 + términos=v1 + llamada al proveedor`;
      #   * que el loader rehúse una lectura que atraviese un publish en vez de mezclar
      #     dos versiones;
      #   * que la cobertura de discovery siga siendo 73/73 sobre la versión publicada y
      #     la precisión siga en 2/73, sin fallback a la industria padre;
      #   * que los topes de 2 llamadas / 5 enrichments / 25 créditos no se muevan, y que
      #     el vocabulario de `classification_source` de #238 siga intacto.
      #
      # Determinista: sin flags de Producción, sin proveedores, sin créditos y sin DB
      # real — la lectura del catálogo se inyecta desde el fixture verificado de `1.0.0`.
      - name: Run A1 catalog source-of-truth and version-coherence tests
        run: npm run test:a1-catalog-source-of-truth

      # AGENT1-MACRO-CATALOG-PRE119-LEGACY-READERS-1 — la COMPATIBILIDAD DE LOS
      # LECTORES DE CATÁLOGO con el cutover a la taxonomía macro entra al check
      # obligatorio, ANTES de que la migración 119 se aplique.
      #
      # El defecto que guarda no falla al compilar y no se ve en Producción hoy:
      # sólo aparece en el instante en que v2 se publica. `active_industry_catalog`
      # hace INNER JOIN con `subindustries`, así que bajo el catálogo macro devuelve
      # CERO filas — su respuesta CORRECTA. Dos consumidores vivos leían ese cero
      # como «no hay catálogo»:
      #
      #   * `validateExploratorySearch` devolvía `_catalog`, y las DOS superficies
      #     del wizard (`prospect-chat-wizard`, `exploratory-search-form-v2`) se
      #     quedaban sin poder validar una búsqueda perfectamente válida;
      #   * `loadImportCatalog` devolvía `empty_catalog`, y las CUATRO rutas de
      #     importación respondían 503.
      #
      # Lo que este paso guarda:
      #
      #   * que la disponibilidad del catálogo la decida la CAPACIDAD de la versión
      #     publicada y NUNCA el número de filas de la vista de subindustrias;
      #   * que bajo v2 la vista legacy no se consulte en absoluto, y que bajo v1 el
      #     comportamiento sea el de siempre — 8 industrias, 73 subindustrias, alias
      #     y los mismos códigos de error, incluido el rechazo de una lectura que
      #     atraviese un publish;
      #   * que una hija obsoleta bajo v2 se RECHACE en vez de ignorarse, para que un
      #     lote nuevo no arrastre criterios que la persona nunca vio;
      #   * que la clasificación de importación macro-only no invente ninguna hija ni
      #     marque filas inválidas, y que las importaciones históricas ancladas a
      #     `1.0.0` conserven industria Y subindustria;
      #   * que Educación siga siendo válida bajo v1, ausente bajo v2 y NUNCA mapeada
      #     a «Compañía de Servicios» (decisión de la owner, 2026-08-13);
      #   * que una versión de catálogo desconocida siga siendo fail-closed a la
      #     taxonomía legacy, sin entrar en modo macro por accidente;
      #   * que el contrato de descubrimiento no se mueva: Salud sigue emitiendo 15
      #     términos específicos y 2 amplios, y siguen siendo 12 macro industrias.
      #
      # Determinista y offline: sin DB real, sin flags de Producción, sin proveedor,
      # sin créditos y sin escrituras. La migración 119 NO se aplica aquí — se SIMULA
      # su efecto sobre las dos vistas.
      - name: Run A1 pre-119 catalog reader compatibility tests
        run: npm run test:a1-pre119-catalog-reader-compatibility

      # AGENT1-APOLLO-FINALIZATION-HARDENING-1 + STABLE-TARGET-WRITER-PARITY —
      # la SEMÁNTICA DE OBJETIVO entra al check obligatorio.
      #
      # Hasta este paso, ninguna de estas suites corría en CI: se ejecutaban a
      # mano. El defecto que guardan es exactamente el tipo de cosa que no falla
      # al compilar y que una ejecución manual olvidada deja pasar — había DOS
      # semánticas de objetivo, y la que decidía el gasto era la laxa.
      #
      # Lo que este paso guarda:
      #
      #   * que exista UNA sola función canónica de elegibilidad hacia el
      #     objetivo (`evaluateCandidateTargetEligibility`), compartida por el
      #     orquestador y por el writer, y que la única diferencia legítima entre
      #     sus dos lecturas sea `persistence_success`;
      #   * que una condición PENDIENTE —la que todavía no se puede saber— NUNCA
      #     cuente hacia el objetivo, igual que una fallida;
      #   * que `employee_count` ausente, LinkedIn ausente, calidad en revisión,
      #     subindustria ambigua o sin mapear (#241) y duplicado no resuelto (§ 9)
      #     dejen al candidato FUERA de la cuenta que detiene el gasto, y que por
      #     tanto siga compitiendo por su enrichment en vez de recibir
      #     `target_already_reached`;
      #   * que `stable_finalizable_candidate_count` deje de ser un alias de
      #     `total_eligible_companies`, y que el invariante
      #     `target_reached == (target_gap == 0)` se sostenga;
      #   * que la métrica PRE-writer y la POSTERIOR al writer no compartan
      #     nombre, y que la reconciliación siga siendo la autoritativa;
      #   * que todo descarte del writer deje una candidata TRAZABLE en
      #     `writer_omitted_samples`, incluido el gate de tamaño ICP, que era el
      #     único de Pass 4 sin muestra;
      #   * que los topes absolutos no se muevan: <=2 búsquedas, <=5 enrichments,
      #     <=25 créditos por corrida.
      #
      # WRITER-ONLY-ADMISSION-PENDING añade a este mismo paso la otra mitad de la
      # asimetría: hay comprobaciones de ADMISIÓN que sólo el writer resuelve
      # —duplicate guard sobre candidatos ACTIVOS, índice de novedad, cooldown de
      # identidad, dedupe intra-lote y cupo del lote—, y su AUSENCIA se estaba
      # leyendo como un pase. Lo que se guarda aquí:
      #
      #   * que la lista auditada de admisiones writer-only siga siendo la
      #     completa (eran dos declaradas de cinco reales) y que la familia pura
      #     todavía sin cablear se nombre aparte en vez de darse por pasada;
      #   * que una admisión sin resolver NO cuente hacia el objetivo, igual que
      #     una condición fallida o pendiente;
      #   * que la PROYECCIÓN (`projected_finalizable_count`) no pueda emitir
      #     `target_already_reached` por mucho que cubra el objetivo, y que sólo
      #     la cuenta ESTABLE detenga gasto;
      #   * que el caso mixto cuente lo resuelto y nada más (3 pass + 2 pending
      #     ⇒ estable 3, hueco 2);
      #   * que la reconciliación POSTERIOR al writer siga siendo la autoritativa
      #     y sostenga `target_reached == (target_count >= target)` y
      #     `target_gap == max(0, target - target_count)`, con `null` —nunca un
      #     número inventado— cuando la completitud no se midió.
      #
      # ADAPTIVE-EARLY-STOP cierra el efecto colateral del addendum anterior. Al
      # declarar las TRECE admisiones permanentemente pendientes, ningún candidato
      # podía ser `stable`: la parada temprana por objetivo quedó MUERTA en
      # producción y toda corrida pasó a recorrer el máximo de gasto autorizado
      # aunque la ronda 1 ya hubiera traído las cinco empresas. Lo que este mismo
      # paso guarda ahora, y que no falla al compilar:
      #
      #   * que los OCHO gates deterministas del writer (etiqueta de calidad,
      #     identidad canónica, dominio de directorio, compatibilidad de país,
      #     página de contenido, intermediario, plataforma externa y calidad de
      #     URL) se resuelvan ANTES del writer invocando LAS MISMAS funciones —no
      #     una copia—, y que lo que el evaluador declara `failed` sea exactamente
      #     lo que el writer real descarta;
      #   * que las TRES respaldadas por base se resuelvan con UN solo prefetch por
      #     corrida: cero consultas por ronda y cero por candidato;
      #   * que ese prefetch sea fail-closed en las tres formas en que puede no
      #     saber —sin cliente, degradado, o dominio fuera de su cobertura—: en las
      #     tres la comprobación vuelve a PENDIENTE, nunca a pase. Un `Map` vacío
      #     contesta «no hay nada» igual que un dominio nunca consultado, y esa
      #     confusión leída como pase es el defecto de este hilo con otro disfraz;
      #   * que la dedupe intra-lote y el cupo se resuelvan con la política del
      #     writer, y que dos candidatas con la MISMA identidad canónica no puedan
      #     contar las dos hacia el objetivo;
      #   * que el cupo sea COMPLETE-FIRST: con el cupo apretado, una candidata de
      #     revisión con MEJOR encaje ya no puede expulsar a una completa y válida.
      #     Se mide donde de verdad ocurre, en Pass 3 del writer real;
      #   * que una admisión resuelta NEGATIVA descarte igual que una condición
      #     fallida, y que no se disfrace de pendiente: hay respuesta, y es que no
      #     pasa;
      #   * que la parada temprana vuelva a existir — cinco finalizables en la
      #     ronda 1 ⇒ sin ronda 2, sin enrichments, gasto estrictamente por debajo
      #     del peor caso permitido —;
      #   * que NO regrese la semántica optimista: tres finalizables y dos sin
      #     `employee_count` ⇒ estable 3, hueco 2, las dos incompletas siguen
      #     compitiendo por su enrichment, y sólo cuando el crédito resuelve el
      #     campo la cuenta sube a 5 y la corrida puede parar;
      #   * que los topes absolutos sigan intactos: <=2 búsquedas, <=5 enrichments,
      #     <=25 créditos.
      #
      # Determinista: sin flags, sin proveedores, sin créditos, sin DB real. El
      # proveedor, el writer y las consultas de duplicados entran por inyección.
      - name: Run A1 Apollo finalization hardening and stable-target parity tests
        run: npm run test:a1-apollo-finalization-hardening

      # AGENT1-APOLLO-CANDIDATE-OPERABILITY-VALIDATION-1 — la OPERABILIDAD del
      # candidato y la veracidad de su ficha entran al check obligatorio.
      #
      # Los defectos medidos en la corrida live `b3afe066…` (candidato
      # `f526cd07…`, runtime `89563be5`) no rompían ningún tipo, no fallaban al
      # compilar y ninguna suite los veía:
      #
      #   * las OCHO filas de Apollo en Producción tenían `record_origin = NULL`,
      #     así que la cola de revisión limpia —que exige `'production'`— no podía
      #     aprobarlas ni descartarlas. El writer canónico nunca escribió la
      #     columna: los `web_ai` con `'production'` venían de un backfill único y
      #     los 22 escritos después de aquel backfill están igual de NULL;
      #   * `scoring.warnings` afirmaba «LinkedIn no disponible» sobre una fila con
      #     `linkedin_url` en columna y `mapping_status = 'confirmed'`, porque
      #     `captureApolloCompanyFields()` corría DESPUÉS de `scoreCandidate()` —un
      #     defecto de ORDEN, invisible al compilador;
      #   * `rich_profile.notes.missing_fields` declaraba ausentes `linkedin_url`,
      #     `subindustry`, `city` y `size` en una fila que tenía los cuatro.
      #
      # Lo que este paso guarda:
      #
      #   * que una corrida REAL escriba `record_origin = 'production'` y que la
      #     fila así escrita PASE el gate de la cola limpia;
      #   * que una corrida en seco y cualquier marcador de smoke/QA NUNCA se
      #     asciendan a `production` — el gate de seguridad no se relaja;
      #   * que los CUATRO gates (approve, approve+convert, discard, duplicate)
      #     sigan rechazando NULL y todo origen no-production;
      #   * que la captura del proveedor preceda al scoring y que los DOS call
      #     sites reciban `linkedinCompanyUrl`;
      #   * que DISPONIBILIDAD y VERIFICACIÓN sean campos distintos: una URL con
      #     verificación ambigua nunca se reporta como ausente, y `mapping_status
      #     = confirmed` nunca se disfraza de «verificado»;
      #   * que `missing_fields` describa ausencias REALES post-enrichment;
      #   * que `final_state_consistency` describa exclusivamente el estado
      #     POST-writer, con el diagnóstico pre-writer conservado con su propio
      #     nombre.
      #
      # Determinista: sin Apollo real, sin Tavily real, sin DB real, sin flags,
      # sin créditos y sin escrituras en Producción.
      - name: Run A1 Apollo candidate operability validation tests
        run: npm run test:a1-apollo-candidate-operability-validation

      # AGENT1-RECORD-ORIGIN-CLASSIFIER-HARDENING-1 — la PRECEDENCIA del
      # clasificador canónico de `record_origin` entra al check obligatorio.
      #
      # #256 enseñó al writer canónico a declarar la procedencia, y con eso la
      # cola de revisión limpia volvió a poder operar un candidato REAL. Lo que
      # ese hito NO podía saber es lo que descubrió el backfill histórico
      # posterior: aplicado a ciegas sobre filas antiguas,
      # `deriveRecordOriginClassification` produce falsos `production`. Tres
      # causas, medidas sobre datos reales, y ninguna rompe una compilación:
      #
      #   * EC-SCVS NO EJECUTADO. Un registro con `provider_calls_allowed=false`,
      #     `live_pilot_not_executed=true` y `execution_authorized=false`
      #     aterrizaba en la regla de `production_status` con confianza 80, porque
      #     su `status='needs_review'` es legítimo y NINGUNA regla miraba esos
      #     tres campos. El status ganaba a la evidencia que lo contradecía;
      #   * QA CLEANUP NO RECONOCIDO. `metadata.qa_cleanup` no era marcador de
      #     nada: la familia QA sólo leía `qa_only`/`do_not_use_for_sales`/
      #     `do_not_convert` y la de limpieza sólo la frase «limpieza histórica»,
      #     así que 15 filas de limpieza de QA visual caían en `unknown`;
      #   * NOTA COMERCIAL COMO PRUEBA. La regla `outside_icp` devolvía
      #     `production` por el SOLO hecho de que `review_notes` dijera «fuera del
      #     segmento». Una frase comercial legítima con basura de QA pegada
      #     bastaba para afirmar procedencia de producción sobre una fila que no
      #     tenía ninguna.
      #
      # Lo que este paso guarda:
      #
      #   * la PRECEDENCIA como contrato: toda la evidencia explícita de
      #     no-producción (smoke > qa > synthetic > cleanup > import >
      #     no-ejecutado) se resuelve ANTES de cualquier inferencia de producción,
      #     y NINGÚN camino de marcador explícito puede devolver `production`,
      #     probado contra los cuatro status legítimos;
      #   * que los tres marcadores fuertes basten CADA UNO por separado, también
      #     anidados un nivel y también en el lote;
      #   * que las dos pistas DÉBILES —`do_not_sync_hubspot`, `runner_required`—
      #     se declaren y NO decidan: una corrida real puede pedir deliberadamente
      #     no sincronizar, y tratarlas como prueba invalidaría filas legítimas;
      #   * que `review_notes` nunca sea la ÚNICA señal que eleve un origen
      #     ambiguo a `production`, conservando el MOTIVO comercial —que es lo
      #     único que la nota aporta— y afirmando el ORIGEN sólo con procedencia
      #     positiva independiente;
      #   * que la producción REAL siga siendo producción: Apollo, web_ai/Tavily y
      #     Lusha con el contrato de #256, los cinco status de producción y el
      #     duplicado con su motivo;
      #   * que el contrato del writer de #256 quede intacto: `dry_run` devuelve
      #     ausencia, y la proyección sigue SIN escribir `classification_source`
      #     ni `classification_confidence` (PR #238 / #241 § 7, el mismo par de
      #     columnas cuyo vocabulario equivocado produjo el 23514);
      #   * que los cuatro gates de la cola limpia sigan rechazando NULL y todo
      #     origen no-production, sin haberlos tocado;
      #   * que el clasificador siga siendo PURO: sin I/O, sin mutar entradas, sin
      #     lanzar sobre datos parciales, y con la confianza dentro del rango que
      #     la CHECK de la migración 093 admite.
      #
      # 0 migraciones, 0 backfills, 0 escrituras en Producción. Determinista y
      # offline: sin Apollo, sin Tavily, sin Lusha, sin HubSpot, sin Supabase, sin
      # flags y sin créditos.
      - name: Run A1 record-origin classifier hardening tests
        run: npm run test:a1-record-origin-classifier-hardening

      # AGENT1-SUBINDUSTRY-PRECISION-COVERAGE-1 · PHASE 2A — resolución EXACTA de
      # la identidad de subindustria, antes de ampliar la cobertura de precisión.
      #
      # El defecto que guarda: `resolveSubindustryKey` emparejaba con contención
      # bidireccional por substring (`normalized.includes(key) ||
      # key.includes(normalized)`). Las claves de precisión son frases largas, así
      # que cualquier substring suyo resolvía a una subindustria REAL: se midió
      # sobre `origin/main` y `"super"`, `"moda"`, `"calzado"`, `"departamento"` y
      # hasta las cadenas de UNA letra `"a"`, `"e"`, `"s"`, `"o"`, `"y"` devolvían
      # `subindustryMapped: true`, con el ganador decidido por el orden de
      # `Object.keys`. Y `subindustryMapped` no es diagnóstico: decide si un
      # candidato puede contar hacia el objetivo (#251) y si deja de persistirse.
      #
      # Lo que este paso protege:
      #
      #   * que la identidad se resuelva SÓLO por id exacto, canónico normalizado
      #     exacto o alias explícito normalizado exacto, y nada más: sin prefijo,
      #     sin sufijo, sin frase contenida, sin contención bidireccional, sin
      #     token parcial y sin fuzzy matching;
      #   * que un alias declarado por dos subindustrias sea ambiguo y NO resuelva;
      #   * fail-closed: sin resolución no hay sector padre, ni clave más cercana,
      #     ni primera entrada del registro, ni mapping por defecto — y un
      #     candidato que confirmaría bajo la política de supermercados no confirma
      #     con una etiqueta que el catálogo no reconoce;
      #   * la auditoría read-only de colisiones sobre las 73 canónicas y los 127
      #     alias publicados, en sus tres clases (canónica-canónica,
      #     alias-canónica, alias-alias);
      #   * ANY-OF intacto: cada subindustria pedida se resuelve por separado, un
      #     ítem irreconocible no contamina a los demás y [A,B] == [B,A];
      #   * que la cobertura de precisión siga siendo EXACTAMENTE 2 de 73 —
      #     «Supermercados e Hipermercados» y «Tiendas por Departamento, Moda y
      #     Calzado»— y que ninguno de los 127 alias publicados resuelva precisión
      #     todavía.
      #
      # 0 mappings nuevos, 0 migraciones, 0 escrituras en Producción. Determinista
      # y offline: sin Apollo, sin Tavily, sin Lusha, sin HubSpot, sin Supabase,
      # sin flags y sin créditos.
      - name: Run A1 subindustry key resolution hardening tests
        run: npm run test:a1-subindustry-key-resolution-hardening

      # AGENT1-SUBINDUSTRY-PRECISION-COVERAGE-1 · PHASE 2B — los datos de precisión
      # de las dos subindustrias mapeadas dejan de ser seis `Record<string,
      # string[]>` dispersos y pasan a ser un `SubindustryPrecisionRuleSet` tipado
      # por subindustria, con registry validado.
      #
      # Por qué entra al check obligatorio: la precisión de subindustria decide si
      # un candidato CUENTA hacia el objetivo (#251) y si se persiste, así que un
      # port «equivalente» que moviera un solo término movería gasto y admisión sin
      # que nada lo dijera. Y a partir de aquí añadir una subindustria es editar un
      # registro, que es exactamente la clase de cambio que necesita un ratchet.
      #
      # Lo que este paso protege:
      #
      #   * el contrato tipado: cada regla declara los mismos campos, su clave está
      #     normalizada y coincide con su canónico, y ninguna regla mapeada se queda
      #     sin anclas;
      #   * cobertura EXACTAMENTE 2 de 73 — «Supermercados e Hipermercados» y
      #     «Tiendas por Departamento, Moda y Calzado», nombradas una a una— y las
      #     71 restantes sin mapeo. Un PR que añada una tercera clave falla aquí;
      #   * § 8 alias de CATÁLOGO ≠ alias de PRECISIÓN: `precisionAliases` vacío en
      #     las dos reglas, y ninguno de los 127 alias publicados —`banco`, `bank`,
      #     `fintech` incluidos— resuelve identidad de precisión;
      #   * § 14 colisiones: clave, canónico normalizado, `subindustryId`,
      #     alias-alias y alias-canónico ajenos ABORTAN la construcción del registro
      #     en el import, en vez de degradar a «gana la primera»;
      #   * § 7 el resolver de #265 sigue intacto: identidad sólo por igualdad
      #     exacta, sin substring, sin fuzzy, sin sector padre y sin que el orden del
      #     registro pueda elegir ganador;
      #   * § 11 paridad: con las dos reglas en `mode: 'full'`, el veredicto
      #     OPERATIVO es el DIAGNÓSTICO sobre toda la matriz de término × campo ×
      #     subindustria, en ANY-OF y en la forma de la metadata persistida;
      #   * §§ 9–10 `confirm_only` implementado y SIN USAR en producción: sobre una
      #     regla TEST-ONLY inyectada, `confirmed` confirma y puede contar, mientras
      #     `ambiguous` y `rejected` quedan como diagnóstico y NO mueven el estado
      #     sectorial, NO crean prioridad de enrichment y NO impiden persistir;
      #   * § 13 ANY-OF con modos mezclados: [A,B] == [B,A] en veredicto y en
      #     conteo, y el empate se desempata por el orden PEDIDO, declarado;
      #   * § 17 «Formación Corporativa y Corporate Training» no está registrada y
      #     no auto-confirma.
      #
      # 0 subindustrias nuevas, 0 migraciones, 0 escrituras en Producción, 0
      # créditos. Determinista y offline: sin Apollo, sin Tavily, sin Lusha, sin
