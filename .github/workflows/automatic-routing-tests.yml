name: Automatic Routing Tests

# Safety gate for Agent 2A automatic contact-enrichment routing (5B/5C).
# Runs the critical routing/fallback test suite on every PR and on pushes to
# main so regressions in Apollo -> Lusha fallback behavior are caught in CI.
# No provider credentials, Supabase env vars, or feature flags are used: the
# suite is fully deterministic and makes no external calls.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: automatic-routing-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automatic-routing:
    name: Automatic routing safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGENT2A-PHONE-WATERFALL-4F: Node 24, la versión con la que se desarrolla.
      # Con Node 20, `mock.module()` no resuelve los alias `@/…` de tsconfig, así que
      # TODA suite de UI que mockee un módulo por alias falla con ERR_MODULE_NOT_FOUND
      # — no por un defecto del código, sino del runner. Era invisible mientras ninguna
      # suite jsdom corría en CI; al entrar las del teléfono, dejó de serlo. Los nueve
      # pasos que ya existían se verificaron uno a uno en Node 24 antes de este cambio.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run automatic routing safety tests
        run: npm run test:agent2a:automatic-routing

      # Q3F-5BB.10C3-FIX-1 — Lusha fail-closed routing (STRICT-ALL). Guards the
      # invariant that a Lusha-eligible search with the preview flag off BLOCKS
      # and never degrades to the Agent 1 / Apollo generation path.
      - name: Run Lusha fail-closed routing tests
        run: npm run test:lusha-fail-closed-routing

      # Q3F-5BB.11B — Pure provider routing plan. Guards the 10C3 invariant at
      # the routing-plan layer: an intended-Lusha plan never routes to Apollo,
      # fail-closed on disabled providers, and unknown cost is never treated as
      # free. Fully deterministic: no env, no provider calls, no DB.
      - name: Run provider routing plan tests
        run: npm run test:provider-routing-plan

      # Q3F-5BB.11C — Additive provider routing metadata contract. Guards that
      # the metadata builders/merges stay pure and additive (existing batch /
      # candidate keys preserved), unknown cost is never persisted as 0, and the
      # candidate source_provider stays consistent with source_trace.sourceProvider.
      - name: Run provider routing metadata tests
        run: npm run test:provider-routing-metadata

      # Q3F-5BB.11D — Lusha ⇄ provider-routing OBSERVATIONAL wiring. Guards that
      # the live Lusha flow stamps additive routing metadata (provider_routing /
      # provider_attempts / provider_trace) without ever selecting Apollo/Tavily,
      # keeps the flag guard authoritative (flag OFF ⇒ no routing plan runs), and
      # never coerces unknown cost to 0. Deterministic: no env, no provider calls,
      # no DB.
      - name: Run Lusha provider routing wiring tests
        run: npm run test:lusha-provider-routing-wiring

      # Q3F-5BB.11E — Apollo ⇄ provider-routing OBSERVATIONAL wiring. Guards that
      # the Agent 1 wizard, when the double gate has already selected Apollo
      # company discovery, stamps additive provider_routing metadata
      # (intended=default_ai, selected=apollo) without adding a fallback, without
      # ever diverting to Lusha (10C3), and without touching phone/contact
      # enrichment; and that Apollo OFF (default_ai → Tavily/null) is not unsafe.
      # Deterministic: no env activation, no provider calls, no DB.
      - name: Run Apollo provider routing wiring tests
        run: npm run test:apollo-provider-routing-wiring

      # Q3F-5BB.11F.1 — Apollo batch provider_attempts[] OBSERVATIONAL metadata.
      # Guards that the candidate-writer emits an additive batch provider_attempts[]
      # entry ONLY for Apollo company discovery (web_search_provider=
      # 'apollo_organizations') AND only when 11E already stamped provider_routing;
      # that Tavily/mock metadata stays byte-for-byte unchanged; that credits are
      # reconciled strictly from provider_usage_logs (apollo/organizations_search),
      # estimated_cost_usd stays null, and unknown counts never become 0; and that
      # the pure helper imports no Supabase/env/fetch/provider/contact-enrichment.
      # Deterministic: no env activation, no provider calls, no real DB.
      - name: Run Apollo provider attempts tests
        run: npm run test:apollo-provider-attempts

      # Q3F-5BB.11F.2 — Apollo per-candidate provider_trace + source_trace.
      # Guards that each inserted candidate row carries an additive
      # metadata.source_provider='apollo', metadata.provider_trace (attempt_index=0,
      # cost null/null) and source_trace.sourceProvider='apollo' ONLY for Apollo
      # company discovery (web_search_provider='apollo_organizations') AND only when
      # 11E already stamped provider_routing; that Tavily/mock candidate rows stay
      # byte-for-byte unchanged (no source_trace/provider_trace/source_provider);
      # that a provider mismatch fails closed (ProviderMetadataConsistencyError);
      # and that the pure helper stays free of Supabase/env/fetch/provider/
      # contact-enrichment/phone-reveal. Deterministic: no env activation, no
      # provider calls, no real DB.
      - name: Run Apollo candidate provider trace tests
        run: npm run test:apollo-candidate-provider-trace

      # A1-LEGACY-PATH-FENCE-1 — P0 fence against implicit legacy Apollo fallback.
      # Guards the six defence layers: canonical parsing of the `sensitive` wizard
      # flags (TRUE/" true"/"true\n" must read as ON, anything else OFF); the typed
      # catalog availability contract (a failed read can no longer collapse into
      # `catalog=null`); that NO availability state resolves to the legacy Apollo
      # experience; that every unavailable UI state renders without a billable CTA
      # and never calls generateAIProspectBatch; that the server-side capability
      # gate (admin + ENABLE_LEGACY_APOLLO_PROSPECT_GENERATION, default OFF) runs
      # BEFORE any batch/agent-run/provider/usage-log write and cannot be unlocked
      # by client-supplied fields; and that ENABLE_APOLLO_COMPANY_SEARCH is enforced
      # authoritatively at runtime immediately before the single
      # searchApolloOrganizations call site. Deterministic: no env activation, no
      # provider calls, no credits, no real DB (Supabase is a loopback stub).
      - name: Run A1 legacy Apollo path fence tests
        run: npm run test:a1-legacy-path-fence

      # A1-APOLLO-TWO-ROUND-QUALITY-1 — modalidad Apollo de dos rondas, de punta a
      # punta. Guarda las invariantes que este hito cierra y que sólo se pueden
      # romper en silencio: que el executor del wizard enrute al orquestador (y con
      # el flag OFF al runner legacy con sus números de siempre); que CADA
      # Organization Enrichment deje UNA fila en provider_usage_logs con la
      # correlación completa, la ronda y el sujeto, y ninguna de más en un reintento;
      # que una operación cuyo cobro no se confirmó quede indeterminada, no se
      # reintente, no ejecute lo que dependa de ella y fuerce billing_unknown; que
      # cada transición recuperable deje un checkpoint durable y que una operación
      # cuyo checkpoint falló NO pueda marcarse como completada; que un reintento
      # recupere rondas, candidatos, enrichments y `candidates_persisted` sin
      # repetir una búsqueda, un enrichment ni una escritura de candidatos; que el
      # checkpoint sea mínimo y sanitizado (sin payloads completos, headers,
      # secretos ni datos personales) y quepa bajo su techo declarado; que su
      # escritura conserve la metadata de otros autores y rechace una versión
      # stale; que la reconciliación sume búsqueda + enrichment de las dos rondas
      # sin duplicar créditos al repetirse; y que el enrichment no repita la
      # verificación de sitio ni la consulta de duplicados. Determinista: sin
      # activación de flags, sin llamadas al proveedor, sin créditos, sin DB real.
      - name: Run A1 Apollo two-round quality tests
        run: npm run test:a1-apollo-two-round-quality

      # A1-APOLLO-PERSISTENCE-REVIEW-FIX-1 — el preflight de persistencia entra al
      # check obligatorio. Sin este paso, la cobertura del guardrail que impide el
      # fallo de LIVE-QA-2 (12 créditos gastados y 0 candidatos guardados porque
      # `prospect_candidates.identity_key` no existía) no corría en ningún PR: el
      # typecheck protege el catálogo de códigos, pero no verifica el ORDEN real del
      # preflight, el cero gasto, la clasificación de los errores de PostgREST, la
      # tabla vacía, la sanitización, el comportamiento post-gasto, la migración
      # estática ni el fixture de QA. Determinista: sin flags, sin proveedores, sin
      # créditos y sin DB real.
      - name: Run A1 Apollo persistence readiness tests
        run: npm run test:a1-apollo-persistence-readiness

      # AGENT1-APOLLO-SCALE-SECOND-ROUND-FIX-1B — la PÁGINA que la ronda 2 pide y el
      # desglose que la UI pinta entran al check obligatorio. Sin este paso ninguna
      # de las dos cosas corría en CI: la corrida live `eae6d47f` pagó cinco créditos
      # por una ronda 2 en la página 1 cuyos términos efectivos se solapaban con la
      # ronda 1 —mismas cinco empresas de vuelta— y la usuaria lo vio como «ya
      # sugeridos recientemente» sin una sola cifra. La suite entra por el runner de
      # producción real con el proveedor doblado y renderiza el panel real.
      # Determinista: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run A1 Apollo second-round page and breakdown tests
        run: npm run test:a1-apollo-scale-second-round

      # AGENT2A-PHONE-WATERFALL-4F — el waterfall de teléfono entra al check
      # obligatorio. Hasta 4F ninguna de estas suites corría en CI: la regresión
      # que 4F corrige (una prueba que seguía exigiendo el modal que 4D eliminó)
      # sobrevivió justamente porque nada la ejecutaba en el PR. Las seis son
      # deterministas: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run phone reveal UI tests
        run: npm run test:agent2a:phone-reveal-ui

      - name: Run phone reveal waterfall tests
        run: npm run test:agent2a:phone-waterfall

      - name: Run phone reveal waterfall legacy tests
        run: npm run test:agent2a:phone-waterfall-legacy

      - name: Run phone direct reveal tests
        run: npm run test:agent2a:phone-direct-reveal

      - name: Run phone credit reservation tests
        run: npm run test:agent2a:phone-credit-reservation

      - name: Run phone drawer sync tests
        run: npm run test:agent2a:phone-drawer-sync

      # AGENT2A-PHONE-REVEAL-4N — la contabilidad del presupuesto entra al check
      # obligatorio. Es donde vive el defecto que este hito cierra y ninguna suite lo
      # cubría: la reserva confirmada de Apollo (8 créditos, `assumed_cap`) no entraba en
      # ningún cálculo de presupuesto porque Apollo no reporta lo que cobra, y sumarla sin
      # excluir el usage log de Lusha habría contado el mismo gasto dos veces (10 → 15 sobre
      # un pozo de 10). La suite reproduce las dos corridas live con sus cifras exactas,
      # verifica que las reservas se lean en UN solo snapshot (para que `reserved →
      # confirmed` no devuelva disponibilidad ni por un instante), que el pozo se empareje
      # tal como quedó ALMACENADO, y que el camino Apollo escriba por fin sus campos
      # terminales. Determinista: sin flags, sin proveedores, sin créditos y sin DB real.
      - name: Run phone budget accounting tests
        run: npm run test:agent2a:phone-budget-accounting

      # El módulo de presupuestos, cuyo resolver es ahora la fuente económica canónica.
      - name: Run budget module tests
        run: npm run test:budgets
